<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 275" role="img" aria-labelledby="drawing-21-1"><title id="drawing-21-1">21.1 · Counting excess electrons — The charge is the net excess charge on the sphere; this is not an atomic-scale drawing.</title><style>text{fill:#263b42;stroke:none;font:16px Georgia,serif}svg{color:#285663}</style><defs><marker id="arrow-21-1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3Z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="160" cy="115" r="60"/><text x="115" y="110">Lead sphere</text><text x="120" y="133">m = 8.00 g</text><text x="270" y="75">Q = −3.20 × 10⁻⁹ C</text><text x="270" y="110">Nₑ = excess electrons</text><text x="270" y="145">N = number of lead atoms</text><text x="115" y="210">Count excess electrons and atoms separately.</text></g></svg>