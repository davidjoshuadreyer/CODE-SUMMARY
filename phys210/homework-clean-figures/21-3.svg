<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 275" role="img" aria-labelledby="drawing-21-3"><title id="drawing-21-3">21.3 · Proton and electron acceleration — Arrows show forces on the particles; the labelled distance is measured between their centres.</title><style>text{fill:#263b42;stroke:none;font:16px Georgia,serif}svg{color:#285663}</style><defs><marker id="arrow-21-3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3Z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="140" cy="110" r="16" fill="var(--bg,#fff)"/><text x="135" y="115">+</text><circle cx="440" cy="110" r="16" fill="var(--bg,#fff)"/><text x="435" y="115">−</text><path d="M164 110 L240 110" marker-end="url(#arrow-21-3)"/><path d="M416 110 L340 110" marker-end="url(#arrow-21-3)"/><text x="120" y="65">Proton</text><text x="410" y="65">Electron</text><path d="M140 158 L440 158" /><text x="210" y="185">r = 2.0 × 10⁻¹⁰ m</text><text x="250" y="235">Forces attract</text></g></svg>