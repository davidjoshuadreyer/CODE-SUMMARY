<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img"><title>The electric field points toward the cathode. The force on an electron points toward the anode.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285663"/></marker></defs><style>text{font:18px Georgia,serif;fill:#263b42;stroke:none}</style><g fill="none" stroke="#285663" stroke-width="2"><path d="M130 30L130 245" /><path d="M550 30L550 245" /><text x="80" y="25">Cathode</text><text x="520" y="25">Anode</text><text x="85" y="270">x = 0; V = 0</text><text x="475" y="270">x = d; V = 240 V</text><circle cx="340" cy="130" r="14" fill="white"/><text x="335" y="136">−</text><path d="M320 95L230 95" marker-end="url(#a)"/><text x="267" y="73">E</text><path d="M360 160L450 160" marker-end="url(#a)"/><text x="405" y="189">Fₑ</text></g></svg>