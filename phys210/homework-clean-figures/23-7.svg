<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img"><title>Both protons approach at the same speed. Their repulsive forces point away from one another.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285663"/></marker></defs><style>text{font:18px Georgia,serif;fill:#263b42;stroke:none}</style><g fill="none" stroke="#285663" stroke-width="2"><circle cx="180" cy="140" r="14" fill="white"/><text x="175" y="146">+</text><circle cx="490" cy="140" r="14" fill="white"/><text x="485" y="146">+</text><path d="M200 105L280 105" marker-end="url(#a)"/><path d="M470 105L390 105" marker-end="url(#a)"/><text x="150" y="70">v →</text><text x="465" y="70">← v</text><path d="M160 140L65 140" marker-end="url(#a)"/><path d="M510 140L605 140" marker-end="url(#a)"/><text x="65" y="120">F</text><text x="595" y="120">F</text><path d="M180 210L490 210" /><text x="220" y="245">At closest approach: both v = 0</text></g></svg>