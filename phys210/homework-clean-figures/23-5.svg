<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img"><title>Two negative charges repel. The moving charge slows while approaching the fixed charge.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285663"/></marker></defs><style>text{font:18px Georgia,serif;fill:#263b42;stroke:none}</style><g fill="none" stroke="#285663" stroke-width="2"><circle cx="160" cy="140" r="14" fill="white"/><text x="155" y="146">−</text><circle cx="480" cy="140" r="14" fill="white"/><text x="475" y="146">−</text><path d="M460 105L370 105" marker-end="url(#a)"/><text x="340" y="85">vᵢ toward q₁</text><path d="M500 170L600 170" marker-end="url(#a)"/><text x="535" y="193">Fₑ</text><text x="105" y="65">q₁ fixed</text><text x="430" y="65">q₂ moving</text><path d="M160 220L480 220" /><text x="205" y="250">rᵢ = 0.800 m; r decreases</text></g></svg>