<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 275" role="img" aria-labelledby="drawing-21-79"><title id="drawing-21-79">21.79 · Field and force from a charged rod — x′ moves along the rod during integration; x is the fixed observation point. The gap r is measured from the rod end, not its centre.</title><style>text{fill:#263b42;stroke:none;font:16px Georgia,serif}svg{color:#285663}</style><defs><marker id="arrow-21-79" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3Z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="2"><path d="M45 150 L530 150" marker-end="url(#arrow-21-79)"/><path d="M55 165 L55 40" marker-end="url(#arrow-21-79)"/><path d="M55 150 H285" stroke-width="10"/><text x="70" y="120">Uniform rod: Q &gt; 0</text><text x="45" y="180">0</text><text x="275" y="180">a</text><circle cx="465" cy="150" r="16" fill="var(--bg,#fff)"/><text x="460" y="155">+</text><text x="442" y="115">q at x</text><path d="M55 210 L285 210" /><text x="156" y="230">a</text><path d="M285 210 L465 210" /><text x="350" y="230">r</text><path d="M170 67 L465 67" /><text x="260" y="56">x − x′</text><path d="M170 140 L170 160" /><text x="145" y="185">x′, dQ</text><text x="475" y="180">x = a + r</text><text x="520" y="134">+x</text><text x="67" y="48">+y</text></g></svg>