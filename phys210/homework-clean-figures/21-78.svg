<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 275" role="img" aria-labelledby="drawing-21-78"><title id="drawing-21-78">21.78 · Deflection between charged plates — Dashed trajectory: curved inside the field, straight afterward. The vertical bracket at the screen is total deflection d. Downward is positive y.</title><style>text{fill:#263b42;stroke:none;font:16px Georgia,serif}svg{color:#285663}</style><defs><marker id="arrow-21-78" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3Z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="2"><path d="M90 55 L275 55" /><path d="M90 175 L275 175" /><path d="M520 45 L520 230" /><path d="M30 95 L90 95" marker-end="url(#arrow-21-78)"/><text x="25" y="75">v₀ →</text><text x="25" y="120">q, m</text><path d="M90 95 Q180 95 275 125 L520 197" stroke-dasharray="5 4"/><path d="M170 80 L170 146" marker-end="url(#arrow-21-78)"/><text x="180" y="140">E ↓</text><path d="M90 25 L275 25" /><text x="100" y="18">ℓ = 0.260 m</text><path d="M275 25 L520 25" /><text x="330" y="18">D = 0.560 m</text><path d="M90 95 L520 95" /><path d="M544 95 L544 197" /><text x="300" y="245">d = 0.0125 m downward at screen</text><text x="340" y="70">E = 0 outside</text><text x="300" y="217">Straight path after plates</text><path d="M50 215 L100 215" marker-end="url(#arrow-21-78)"/><text x="105" y="220">+x</text><path d="M50 215 L50 250" marker-end="url(#arrow-21-78)"/><text x="64" y="252">+y</text></g></svg>