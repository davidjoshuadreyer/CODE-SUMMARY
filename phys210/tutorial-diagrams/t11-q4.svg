<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 4: Induced emf from a changing rectangular area</title><desc id="desc">The rectangle becomes longer and narrower; the unequal dimensions make the total area decrease. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><rect x="90" y="140" width="210" height="150" fill="none" stroke="#71828a" stroke-width="2.5"/><rect x="65" y="160" width="280" height="110" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M300,195 L380,195" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M380,195 L368.0,190.0 L368.0,200.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M160,135 L160,157" fill="none" stroke="#b74444" stroke-width="3"/><path d="M160,157 L165.0,145.0 L155.0,145.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="105" y="110" fill="#243943" font-size="17" text-anchor="start">t = 0 (grey)</text><text x="100" y="320" fill="#243943" font-size="17" text-anchor="start">t = 4 s (teal)</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Length grows: 0.60 → 0.68</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">m.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Width shrinks: 0.40 →</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">0.32 m.</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">Area decreases at 0.0072</text><text x="440" y="257" fill="#243943" font-size="18" text-anchor="start">m²/s.</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">|emf| = B |dA/dt| = 3.6</text><text x="440" y="323" fill="#243943" font-size="18" text-anchor="start">mV</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 4</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>