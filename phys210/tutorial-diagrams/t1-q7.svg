<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Building height from projectile range</title><desc id="desc">A rock leaves a building at 12.2 m/s, 53° above horizontal, and lands 25 m from its base. Find the height; use g = 9.80 m/s².</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T1-Q7  ·  Building height from projectile range</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M75 320L440 320" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M105 320L105 180" fill="none" stroke="#253840" stroke-width="5"/>
<path d="M105 180L166 99" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="166,99 156.38956504484673,104.28105481630024 163.5789001729193,109.69524546830553" fill="#137b80"/>
<path d="M105 180 Q235 -20 420 320" fill="none" stroke="#137b80" stroke-width="3"/>
<path d="M75 180L75 320" fill="none" stroke="#be4949" stroke-width="2"/>
<text x="30" y="255" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">h</text>
<path d="M105 180L190 180" fill="none" stroke="#69777d" stroke-width="1" stroke-dasharray="6 5"/>
<text x="138" y="168" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">53°</text>
<text x="165" y="88" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">12.2 m/s</text>
<text x="235" y="347" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">25 m</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Launch point: y = 0</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Ground: y = −h</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">t = 25 / (12.2 cos 53°)</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">h = 23.63 m</text>
</svg>