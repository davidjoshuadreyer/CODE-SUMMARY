<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 5: Coil inside a time-varying solenoid</title><desc id="desc">The shaded inner area is the surface used for flux, not the full solenoid cross-section. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="215" cy="205" r="110" fill="#eef2f1" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="205" r="60" fill="#d8ece8" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="205" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="205" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="80" y="340" fill="#243943" font-size="17" text-anchor="start">Cross-section normal to axis</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Solenoid area: 0.40 m².</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Shaded coil area: 0.15</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">m².</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Only coil area links</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">flux.</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">N = 300; |emf| = 1.018 V</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 5</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>