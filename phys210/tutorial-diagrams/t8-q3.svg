<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Comparing two rated light bulbs</title><desc id="desc">Two rated bulbs displayed side by side at equal voltage; lower power A has higher resistance and lower current.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Comparing two rated light bulbs</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Compare operating values at the same rated voltage.</text><circle cx="200" cy="165" r="43" fill="#f5e8b0" stroke="#243942" stroke-width="2"/><text x="200" y="172" text-anchor="middle" font-size="24" fill="#243942">A</text><text x="200" y="235" text-anchor="middle" font-size="18" fill="#243942">60 W at 110 V</text><text x="200" y="270" text-anchor="middle" font-size="18" fill="#243942">R = 202 Ω</text><text x="200" y="300" text-anchor="middle" font-size="18" fill="#243942">I = 0.545 A</text><circle cx="520" cy="165" r="43" fill="#f5e8b0" stroke="#243942" stroke-width="2"/><text x="520" y="172" text-anchor="middle" font-size="24" fill="#243942">B</text><text x="520" y="235" text-anchor="middle" font-size="18" fill="#243942">100 W at 110 V</text><text x="520" y="270" text-anchor="middle" font-size="18" fill="#243942">R = 121 Ω</text><text x="520" y="300" text-anchor="middle" font-size="18" fill="#243942">I = 0.909 A</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Equal voltage: R = V²/P and I = P/V</text></g></svg>