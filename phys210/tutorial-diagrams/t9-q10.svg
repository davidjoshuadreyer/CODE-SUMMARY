<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 10: Proton orbit after acceleration</title><desc id="desc">A proton gains kinetic energy before entering the perpendicular magnetic field. The shown bend illustrates an into-page field. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><rect x="45" y="150" width="120" height="110" fill="none" stroke="#71828a" stroke-width="2.5"/><text x="58" y="182" fill="#243943" font-size="20" text-anchor="start">2.5 kV</text><text x="58" y="213" fill="#243943" font-size="16" text-anchor="start">accelerator</text><path d="M165,205 L265,205" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M265,205 L253.0,200.0 L253.0,210.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="185" y="180" fill="#243943" font-size="16" text-anchor="start">proton</text><path d="M265 205 A65 65 0 0 0 330 140" stroke="#087f8c" stroke-width="3" fill="none"/><circle cx="320" cy="95" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M315,90 L325,100" fill="none" stroke="#71828a" stroke-width="2"/><path d="M315,100 L325,90" fill="none" stroke="#71828a" stroke-width="2"/><text x="240" y="75" fill="#243943" font-size="16" text-anchor="start">B into page</text><path d="M265,140 L330,140" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="305" fill="#243943" font-size="18" text-anchor="start">r = 12 mm</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Chosen field orientation.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Electric field adds</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">kinetic energy.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Magnetic field bends the</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">path.</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">½mv² = eΔV; r = mv/eB</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 10</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>