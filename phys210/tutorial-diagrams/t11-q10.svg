<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 10: Lenz’s law for a falling magnet</title><desc id="desc">Viewed from above, induced current is counterclockwise during approach and clockwise during departure of the falling magnet. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="130" cy="210" r="65" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M185 210 A55 55 0 0 0 130 155" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M143,157 L130,155" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M130,155 L141.10017445053768,161.76654469930037 L142.6207462930771,151.88282772279422 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><circle cx="130" cy="210" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="130" cy="210" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="130" y="110" fill="#243943" font-size="18" text-anchor="middle">Approach</text><text x="130" y="310" fill="#243943" font-size="20" text-anchor="middle">CCW</text><circle cx="320" cy="210" r="65" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M375 210 A55 55 0 0 1 320 265" stroke="#087f8c" stroke-width="3" fill="none"/><path d="M333,263 L320,265" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M320,265 L332.6207462930771,268.11717227720584 L331.1001744505377,258.23345530069963 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><circle cx="320" cy="210" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M315,205 L325,215" fill="none" stroke="#71828a" stroke-width="2"/><path d="M315,215 L325,205" fill="none" stroke="#71828a" stroke-width="2"/><text x="320" y="110" fill="#243943" font-size="18" text-anchor="middle">Departure</text><text x="320" y="310" fill="#243943" font-size="20" text-anchor="middle">CW</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Top view of horizontal</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">loop.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">North pole falls</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">downward.</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">Approach: induced B</text><text x="440" y="257" fill="#243943" font-size="18" text-anchor="start">upward.</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">Departure: induced B</text><text x="440" y="323" fill="#243943" font-size="18" text-anchor="start">downward.</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 10</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>