<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Voltage division in a series capacitor branch</title><desc id="desc">Five microfarad capacitor lies in parallel with series fifteen and thirty microfarad capacitors. Series branch voltage divides sixteen and eight volts.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Voltage division in a series capacitor branch</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Redrawn connections: C₁ is parallel to the C₂–C₃ branch.</text><line x1="130" y1="140" x2="200" y2="140" stroke="#243942" stroke-width="2"/><line x1="520" y1="140" x2="590" y2="140" stroke="#243942" stroke-width="2"/><line x1="130" y1="250" x2="200" y2="250" stroke="#243942" stroke-width="2"/><line x1="520" y1="250" x2="590" y2="250" stroke="#243942" stroke-width="2"/><line x1="130" y1="140" x2="130" y2="310" stroke="#243942" stroke-width="2"/><line x1="590" y1="140" x2="590" y2="310" stroke="#243942" stroke-width="2"/><line x1="322" y1="140" x2="353" y2="140" stroke="#243942" stroke-width="2"/><line x1="353" y1="118" x2="353" y2="162" stroke="#243942" stroke-width="2"/><line x1="367" y1="118" x2="367" y2="162" stroke="#243942" stroke-width="2"/><line x1="367" y1="140" x2="398" y2="140" stroke="#243942" stroke-width="2"/><text x="360" y="108" text-anchor="middle" font-size="17" fill="#243942">C₁ = 5 μF</text><line x1="200" y1="140" x2="322" y2="140" stroke="#243942" stroke-width="2"/><line x1="398" y1="140" x2="520" y2="140" stroke="#243942" stroke-width="2"/><line x1="222" y1="250" x2="253" y2="250" stroke="#243942" stroke-width="2"/><line x1="253" y1="228" x2="253" y2="272" stroke="#243942" stroke-width="2"/><line x1="267" y1="228" x2="267" y2="272" stroke="#243942" stroke-width="2"/><line x1="267" y1="250" x2="298" y2="250" stroke="#243942" stroke-width="2"/><text x="260" y="218" text-anchor="middle" font-size="17" fill="#243942">C₂ = 15 μF</text><line x1="422" y1="250" x2="453" y2="250" stroke="#243942" stroke-width="2"/><line x1="453" y1="228" x2="453" y2="272" stroke="#243942" stroke-width="2"/><line x1="467" y1="228" x2="467" y2="272" stroke="#243942" stroke-width="2"/><line x1="467" y1="250" x2="498" y2="250" stroke="#243942" stroke-width="2"/><text x="460" y="218" text-anchor="middle" font-size="17" fill="#243942">C₃ = 30 μF</text><line x1="200" y1="250" x2="222" y2="250" stroke="#243942" stroke-width="2"/><line x1="298" y1="250" x2="422" y2="250" stroke="#243942" stroke-width="2"/><line x1="498" y1="250" x2="520" y2="250" stroke="#243942" stroke-width="2"/><text x="260" y="292" text-anchor="middle" font-size="18" fill="#243942">16 V</text><text x="460" y="292" text-anchor="middle" font-size="18" fill="#243942">8 V</text><text x="85" y="220" text-anchor="middle" font-size="22" fill="#243942">+</text><text x="630" y="220" text-anchor="middle" font-size="22" fill="#243942">−</text><text x="360" y="320" text-anchor="middle" font-size="18" fill="#243942">24 V across either complete branch</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Series charge Q₂ = Q₃ = 240 μC</text></g></svg>