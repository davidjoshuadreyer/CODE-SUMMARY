<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Net electric flux through a submarine</title><desc id="desc">Charges +5.00 μC, −9.00 μC, +27.0 μC, and −84.0 μC lie inside a submarine. Find (a) net outward flux and (b) whether more field lines leave or enter.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q24-9  ·  Net electric flux through a submarine</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<ellipse cx="245" cy="205" rx="180" ry="105" fill="#e9f2f1" stroke="#137b80" stroke-width="2"/>
<text x="140" y="170" font-family="Arial, sans-serif" font-size="21" fill="#253840" text-anchor="start">+5 μC</text>
<text x="280" y="170" font-family="Arial, sans-serif" font-size="21" fill="#253840" text-anchor="start">−9 μC</text>
<text x="140" y="245" font-family="Arial, sans-serif" font-size="21" fill="#253840" text-anchor="start">+27 μC</text>
<text x="280" y="245" font-family="Arial, sans-serif" font-size="21" fill="#253840" text-anchor="start">−84 μC</text>
<path d="M245 65L245 110" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="245,110 249.5,100.0 240.5,100.0" fill="#be4949"/>
<path d="M245 350L245 305" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="245,305 240.5,315.0 249.5,315.0" fill="#be4949"/>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Closed submarine hull</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Qenc = −61.0 μC</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Φ = Qenc/ε₀ &lt; 0</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Net flux is inward.</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Shape does not affect total flux.</text>
</svg>