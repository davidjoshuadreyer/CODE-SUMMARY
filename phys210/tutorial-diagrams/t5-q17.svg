<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Recovering a point charge from E and V</title><desc id="desc">Observation point P is six metres from a negative point charge. Electric field points toward the charge.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Recovering a point charge from E and V</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">A negative source produces inward field and negative potential.</text><circle cx="150" cy="190" r="19" fill="#ad433d"/><text x="150" y="196" text-anchor="middle" font-size="23" fill="white">−</text><text x="150" y="234" text-anchor="middle" font-size="18" fill="#243942">Q = −2.00 μC</text><circle cx="550" cy="190" r="7" fill="#176b72"/><text x="550" y="140" text-anchor="middle" font-size="18" fill="#243942">P: V = −3000 V</text><line x1="530" y1="190" x2="340" y2="190" stroke="#176b72" stroke-width="3"/><polygon points="340,190 349.9049181258794,185.21537912477646 349.9049181258794,194.78462087522354" fill="#176b72"/><text x="435.0" y="220" text-anchor="middle" font-size="18" fill="#176b72">E = 500 V/m</text><line x1="150" y1="285" x2="550" y2="285" stroke="#243942" stroke-width="2"/><text x="350" y="310" text-anchor="middle" font-size="18" fill="#243942">r = |V| / E = 6.00 m</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">|Q| = |V|r / k</text></g></svg>