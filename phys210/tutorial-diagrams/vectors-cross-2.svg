<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Only the upward force component produces torque</title><desc id="desc">In the east–up plane, the eastward lever crosses the upward force component to give torque toward south. Schematic.</desc><rect width="760" height="380" fill="#fffefb"/><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#235d67"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a13e38"/></marker></defs><g font-family="Georgia,serif"><text x="28.0" y="36.0" fill="#242420" font-size="22" text-anchor="start">Only the upward force component produces torque</text><path d="M85.0,190.0 L365.0,190.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><path d="M225.0,310.0 L225.0,70.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><text x="370.0" y="195.0" fill="#242420" font-size="16" text-anchor="start">E</text><text x="232.0" y="75.0" fill="#242420" font-size="16" text-anchor="start">Up</text><path d="M225.0,190.0 L340.0,190.0" stroke="#235d67" stroke-width="2.5" fill="none"/><polygon points="340.0,190.0 330.0,186.0 330.0,194.0" fill="#235d67"/><text x="348.0" y="178.0" fill="#235d67" font-size="18" text-anchor="start">R: east</text><path d="M225.0,190.0 L292.2,122.8" stroke="#a13e38" stroke-width="2.5" fill="none"/><polygon points="292.175144212722,122.82485578727798 282.2756492761103,127.06749647439727 287.9325035256027,132.72435072388964" fill="#a13e38"/><text x="300.2" y="144.8" fill="#a13e38" font-size="18" text-anchor="start">F: 45° up</text><polyline fill="none" stroke="#746c5d" stroke-width="1.5" points="270.0,190.0 270.0,189.1 270.0,188.2 269.9,187.4 269.9,186.5 269.8,185.6 269.7,184.7 269.6,183.8 269.4,183.0 269.3,182.1 269.1,181.2 269.0,180.4 268.8,179.5 268.5,178.6 268.3,177.8 268.1,176.9 267.8,176.1 267.5,175.3 267.2,174.4 266.9,173.6 266.6,172.8 266.2,172.0 265.9,171.2 265.5,170.4 265.1,169.6 264.7,168.8 264.3,168.0 263.8,167.2 263.4,166.5 262.9,165.7 262.4,165.0 261.9,164.3 261.4,163.5 260.9,162.8 260.3,162.1 259.8,161.5 259.2,160.8 258.6,160.1 258.0,159.5 257.4,158.8 256.8,158.2"/><text x="290.6" y="162.8" fill="#625d51" font-size="17" text-anchor="middle">45°</text><text x="455.0" y="115.0" fill="#242420" font-size="17" text-anchor="start">CROSS PRODUCT</text><text x="455.0" y="155.0" fill="#242420" font-size="25" text-anchor="start">τ = R × F</text><text x="455.0" y="201.0" fill="#242420" font-size="18" text-anchor="start">East × up = south</text><text x="455.0" y="229.0" fill="#242420" font-size="18" text-anchor="start">Parallel component: no torque</text><text x="455.0" y="257.0" fill="#242420" font-size="18" text-anchor="start">τ points south.</text><text x="28.0" y="356.0" fill="#242420" font-size="16" text-anchor="start">Directions follow the stated coordinate system; arrow lengths are schematic.</text></g></svg>