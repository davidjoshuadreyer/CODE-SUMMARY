<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Field from perpendicular infinite sheets</title><desc id="desc">Two infinite sheets are perpendicular, carrying +60 pC/m² and −80 pC/m². Find the field magnitude away from either sheet.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T4-Q1  ·  Field from perpendicular infinite sheets</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M70 220L430 220" fill="none" stroke="#137b80" stroke-width="6"/>
<path d="M240 70L240 340" fill="none" stroke="#be4949" stroke-width="6"/>
<text x="60" y="255" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">−80 pC/m²</text>
<text x="255" y="90" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">+60 pC/m²</text>
<circle cx="335" cy="150" r="5" fill="#253840" stroke="#253840" stroke-width="2"/>
<path d="M335 150L415 150" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="415,150 405.0,145.5 405.0,154.5" fill="#be4949"/>
<path d="M335 150L335 205" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="335,205 339.5,195.0 330.5,195.0" fill="#137b80"/>
<path d="M335 150L415 205" fill="none" stroke="#253840" stroke-width="3"/>
<polygon points="415,205 409.30896046099815,195.6265231122322 404.2102010550145,203.0429004300265" fill="#253840"/>
<text x="355" y="130" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E₁</text>
<text x="300" y="190" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E₂</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Cross-section of infinite sheets</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">One quadrant shown.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Positive sheet: away</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Negative sheet: toward</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">|E| = √(E₁² + E₂²) = 5.647 N/C</text>
</svg>