<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Where field and potential vanish</title><desc id="desc">Number line identifies E zero at −4.83 metres and V zero at −2.00 and +0.667 metres, with charges at zero and two metres.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Where field and potential vanish</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Field cancellation and zero potential occur at different locations.</text><line x1="55" y1="200" x2="665" y2="200" stroke="#176b72" stroke-width="3"/><polygon points="665,200 655.0950818741205,204.78462087522354 655.0950818741205,195.21537912477646" fill="#176b72"/><text x="660" y="240" text-anchor="middle" font-size="18" fill="#176b72">x (m)</text><line x1="95" y1="195" x2="95" y2="205" stroke="#243942" stroke-width="2"/><text x="95" y="245" text-anchor="middle" font-size="17" fill="#243942">−4.83</text><line x1="300" y1="195" x2="300" y2="205" stroke="#243942" stroke-width="2"/><text x="300" y="245" text-anchor="middle" font-size="17" fill="#243942">−2.00</text><line x1="445" y1="195" x2="445" y2="205" stroke="#243942" stroke-width="2"/><text x="445" y="285" text-anchor="middle" font-size="17" fill="#243942">0</text><line x1="490" y1="195" x2="490" y2="205" stroke="#243942" stroke-width="2"/><text x="490" y="290" text-anchor="middle" font-size="17" fill="#243942">+0.667</text><line x1="605" y1="195" x2="605" y2="205" stroke="#243942" stroke-width="2"/><text x="605" y="285" text-anchor="middle" font-size="17" fill="#243942">+2.00</text><circle cx="445" cy="200" r="19" fill="#176b72"/><text x="445" y="206" text-anchor="middle" font-size="23" fill="white">+</text><text x="445" y="244" text-anchor="middle" font-size="18" fill="#243942">+q</text><circle cx="605" cy="200" r="19" fill="#ad433d"/><text x="605" y="206" text-anchor="middle" font-size="23" fill="white">−</text><text x="605" y="244" text-anchor="middle" font-size="18" fill="#243942">−2q</text><circle cx="95" cy="200" r="6" fill="#176b72"/><text x="95" y="155" text-anchor="middle" font-size="18" fill="#176b72">E = 0</text><circle cx="300" cy="200" r="6" fill="#ad433d"/><text x="300" y="155" text-anchor="middle" font-size="18" fill="#ad433d">V = 0</text><circle cx="490" cy="200" r="6" fill="#ad433d"/><text x="490" y="115" text-anchor="middle" font-size="18" fill="#ad433d">V = 0</text><line x1="490" y1="125" x2="490" y2="185" stroke="#ad433d" stroke-width="2" stroke-dasharray="6 5"/><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Between the charges, both electric fields point right.</text></g></svg>