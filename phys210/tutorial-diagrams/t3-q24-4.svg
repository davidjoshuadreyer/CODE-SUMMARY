<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Flux through a triangular closed box</title><desc id="desc">A triangular prism lies in a horizontal field E = 7.80×10⁴ N/C. Its vertical face is 10 cm high by 30 cm long; the sloped face makes 60° with the vertical in the end cross-section. Find outward flux through (a) vertical face, (b) slanted face, (c) the entire box.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q24-4  ·  Flux through a triangular closed box</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M100 300 L100 130 L395 300 Z" fill="none" stroke="#253840" stroke-width="3"/>
<path d="M100 130L165 80" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M395 300L460 250" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M100 300L165 250" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M165 80L460 250" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M165 80L165 250" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M165 250L460 250" fill="none" stroke="#253840" stroke-width="2"/>
<path d="M35 210L150 210" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="150,210 140.0,205.5 140.0,214.5" fill="#137b80"/>
<path d="M300 210L435 210" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="435,210 425.0,205.5 425.0,214.5" fill="#137b80"/>
<text x="30" y="190" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E →</text>
<text x="35" y="280" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">10 cm</text>
<text x="110" y="100" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">30 cm</text>
<text x="116" y="172" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">60°</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Vertical face: flux enters.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Φv = −E(0.10)(0.30)</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Slanted face: flux exits.</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Φs = +E(0.10)(0.30)</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Total closed flux = 0</text>
</svg>