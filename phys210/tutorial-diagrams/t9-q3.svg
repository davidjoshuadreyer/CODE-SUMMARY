<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 3: Force on an inverted U-shaped wire</title><desc id="desc">The vertical legs align with the field; only the top segment produces an out-of-page force. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M90 290 L90 140 L330 140 L330 290" stroke="#087f8c" stroke-width="5" fill="none"/><path d="M90,270 L90,195" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M90,195 L85.0,207.0 L95.0,207.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M140,140 L270,140" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M270,140 L258.0,135.0 L258.0,145.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M330,195 L330,270" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M330,270 L335.0,258.0 L325.0,258.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M200,300 L200,225" fill="none" stroke="#243943" stroke-width="3"/><path d="M200,225 L195.0,237.0 L205.0,237.0 Z" stroke="#243943" stroke-width="1" fill="#243943"/><text x="220" y="270" fill="#243943" font-size="18" text-anchor="start">B ↑</text><text x="185" y="120" fill="#243943" font-size="18" text-anchor="start">2L</text><text x="55" y="225" fill="#243943" font-size="18" text-anchor="start">L</text><circle cx="210" cy="175" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="210" cy="175" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="228" y="181" fill="#243943" font-size="18" text-anchor="start">F</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Both vertical legs: F =</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">0.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Top: +x × +y = +z.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Net F = 2IBL out of page.</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 3</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>