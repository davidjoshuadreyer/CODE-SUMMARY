<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Charge passing through a light bulb</title><desc id="desc">Bulb with equal conventional current arrows entering and leaving. Fifteen coulombs cross each side in one minute.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Charge passing through a light bulb</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Steady current: the same charge enters and leaves the bulb.</text><circle cx="360" cy="190" r="48" fill="#f5e8b0" stroke="#243942" stroke-width="2"/><line x1="330" y1="160" x2="390" y2="220" stroke="#243942" stroke-width="2"/><line x1="330" y1="220" x2="390" y2="160" stroke="#243942" stroke-width="2"/><line x1="80" y1="190" x2="300" y2="190" stroke="#176b72" stroke-width="3"/><polygon points="300,190 290.0950818741206,194.78462087522354 290.0950818741206,185.21537912477646" fill="#176b72"/><text x="190.0" y="150" text-anchor="middle" font-size="18" fill="#176b72">15 C enters in 60 s</text><line x1="420" y1="190" x2="640" y2="190" stroke="#176b72" stroke-width="3"/><polygon points="640,190 630.0950818741205,194.78462087522354 630.0950818741205,185.21537912477646" fill="#176b72"/><text x="530.0" y="150" text-anchor="middle" font-size="18" fill="#176b72">15 C leaves in 60 s</text><text x="360" y="285" text-anchor="middle" font-size="18" fill="#243942">30 W at 120 V</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">I = P/V = 0.25 A; Q = It = 15 C</text></g></svg>