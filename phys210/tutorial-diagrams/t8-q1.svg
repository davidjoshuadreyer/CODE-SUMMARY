<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Voltage from an electron count</title><desc id="desc">Resistor with conventional current to the right and electron motion to the left. Voltage polarity follows conventional current drop.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Voltage from an electron count</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Conventional current is opposite electron motion.</text><line x1="100" y1="200" x2="305" y2="200" stroke="#243942" stroke-width="2"/><line x1="305" y1="200" x2="325" y2="200" stroke="#243942" stroke-width="2"/><rect x="325" y="189" width="70" height="22" rx="4" fill="white" stroke="#243942" stroke-width="1.5"/><line x1="395" y1="200" x2="415" y2="200" stroke="#243942" stroke-width="2"/><text x="360" y="176" text-anchor="middle" font-size="17" fill="#243942">20 Ω</text><line x1="415" y1="200" x2="620" y2="200" stroke="#243942" stroke-width="2"/><line x1="200" y1="130" x2="520" y2="130" stroke="#176b72" stroke-width="3"/><polygon points="520,130 510.0950818741206,134.78462087522354 510.0950818741206,125.21537912477646" fill="#176b72"/><text x="360.0" y="105" text-anchor="middle" font-size="18" fill="#176b72">I = 1.335 A</text><line x1="520" y1="270" x2="200" y2="270" stroke="#176b72" stroke-width="3"/><polygon points="200,270 209.90491812587945,265.21537912477646 209.90491812587945,274.78462087522354" fill="#176b72"/><text x="360.0" y="305" text-anchor="middle" font-size="18" fill="#176b72">electron motion</text><text x="360" y="240" text-anchor="middle" font-size="17" fill="#243942">5.0 × 10²¹ electrons in 600 s</text><text x="110" y="185" text-anchor="middle" font-size="22" fill="#243942">+</text><text x="610" y="185" text-anchor="middle" font-size="22" fill="#243942">−</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">|ΔV| = (Ne/t)R = 26.7 V ≈ 27 V</text></g></svg>