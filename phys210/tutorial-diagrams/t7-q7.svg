<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Dielectric insertion after battery disconnection</title><desc id="desc">Isolated capacitor filled with dielectric of relative permittivity three, with charge fixed and voltage reduced to one third.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Dielectric insertion after battery disconnection</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Dielectric κ = 3 inserted after disconnection.</text><text x="190" y="112" text-anchor="middle" font-size="18" fill="#607278">BEFORE</text><text x="530" y="112" text-anchor="middle" font-size="18" fill="#607278">AFTER</text><line x1="160.0" y1="135" x2="160.0" y2="245" stroke="#176b72" stroke-width="4"/><line x1="220.0" y1="135" x2="220.0" y2="245" stroke="#ad433d" stroke-width="4"/><text x="142.0" y="190" text-anchor="middle" font-size="22" fill="#176b72">+</text><text x="238.0" y="190" text-anchor="middle" font-size="22" fill="#ad433d">−</text><text x="190" y="275" text-anchor="middle" font-size="18" fill="#243942">air: C₀, V₀</text><rect x="500.0" y="145" width="60" height="90" rx="4" fill="#d9ebe4" stroke="#d9ebe4" stroke-width="1.5"/><line x1="500.0" y1="135" x2="500.0" y2="245" stroke="#176b72" stroke-width="4"/><line x1="560.0" y1="135" x2="560.0" y2="245" stroke="#ad433d" stroke-width="4"/><text x="482.0" y="190" text-anchor="middle" font-size="22" fill="#176b72">+</text><text x="578.0" y="190" text-anchor="middle" font-size="22" fill="#ad433d">−</text><text x="530" y="275" text-anchor="middle" font-size="18" fill="#243942">dielectric: 3C₀, V₀/3</text><line x1="310" y1="190" x2="405" y2="190" stroke="#176b72" stroke-width="3"/><polygon points="405,190 395.0950818741206,194.78462087522354 395.0950818741206,185.21537912477646" fill="#176b72"/><text x="190" y="310" text-anchor="middle" font-size="17" fill="#243942">Isolated: Q fixed</text><text x="530" y="310" text-anchor="middle" font-size="17" fill="#243942">Isolated: Q fixed</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">The free plate charge stays Q₀.</text></g></svg>