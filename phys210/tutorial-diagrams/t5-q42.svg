<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Potential difference along a charged ring axis</title><desc id="desc">Ring shown obliquely, radius R and axial observation point two radii away. Right triangle gives source distance square root five R.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Potential difference along a charged ring axis</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Every ring element is the same distance from an axial point.</text><ellipse cx="210" cy="200" rx="50" ry="105" fill="none" stroke="#176b72" stroke-width="3"/><line x1="110" y1="200" x2="660" y2="200" stroke="#176b72" stroke-width="3"/><polygon points="660,200 650.0950818741205,204.78462087522354 650.0950818741205,195.21537912477646" fill="#176b72"/><text x="665" y="225" text-anchor="middle" font-size="18" fill="#176b72">z</text><circle cx="210" cy="200" r="5" fill="#176b72"/><circle cx="580" cy="200" r="6" fill="#176b72"/><line x1="210" y1="95" x2="580" y2="200" stroke="#ad433d" stroke-width="2"/><line x1="210" y1="95" x2="210" y2="200" stroke="#607278" stroke-width="2"/><text x="175" y="155" text-anchor="middle" font-size="18" fill="#243942">R</text><text x="415" y="125" text-anchor="middle" font-size="18" fill="#ad433d">√5 R</text><text x="210" y="330" text-anchor="middle" font-size="18" fill="#243942">center: z = 0</text><text x="580" y="245" text-anchor="middle" font-size="18" fill="#243942">z = 2R</text><text x="400" y="280" text-anchor="middle" font-size="18" fill="#243942">axis distance = 2R</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">V(2R) − V(0) = (kQ/R)(1/√5 − 1)</text></g></svg>