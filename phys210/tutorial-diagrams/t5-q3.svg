<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Accelerating a proton and an electron</title><desc id="desc">Proton accelerates toward lower potential; electron toward higher potential. Both gain equal kinetic energy but electron moves faster.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Accelerating a proton and an electron</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Both particles start at rest and gain 120 eV.</text><circle cx="110" cy="145" r="19" fill="#176b72"/><text x="110" y="151" text-anchor="middle" font-size="23" fill="white">+</text><text x="110" y="189" text-anchor="middle" font-size="18" fill="#243942">proton</text><line x1="145" y1="145" x2="420" y2="145" stroke="#176b72" stroke-width="3"/><polygon points="420,145 410.0950818741206,149.78462087522354 410.0950818741206,140.21537912477646" fill="#176b72"/><text x="282.5" y="132.0" text-anchor="middle" font-size="18" fill="#176b72">acceleration</text><text x="540" y="133" text-anchor="middle" font-size="18" fill="#243942">ΔV = −120 V</text><text x="540" y="167" text-anchor="middle" font-size="18" fill="#243942">1.52 × 10⁵ m/s</text><circle cx="110" cy="265" r="19" fill="#ad433d"/><text x="110" y="271" text-anchor="middle" font-size="23" fill="white">−</text><text x="110" y="309" text-anchor="middle" font-size="18" fill="#243942">electron</text><line x1="145" y1="265" x2="420" y2="265" stroke="#176b72" stroke-width="3"/><polygon points="420,265 410.0950818741206,269.78462087522354 410.0950818741206,260.21537912477646" fill="#176b72"/><text x="282.5" y="252.0" text-anchor="middle" font-size="18" fill="#176b72">acceleration</text><text x="540" y="253" text-anchor="middle" font-size="18" fill="#243942">ΔV = +120 V</text><text x="540" y="287" text-anchor="middle" font-size="18" fill="#243942">6.50 × 10⁶ m/s</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">ΔK = −qΔV = ½mv² &gt; 0</text></g></svg>