<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Energy in a capacitor network</title><desc id="desc">Equivalent two-capacitor series circuit: eighty and forty-eight microfarad groups across thirty volts. C3 shares right-group voltage.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Energy in a capacitor network</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Equivalent circuit: each parallel group is combined first.</text><line x1="100" y1="180" x2="190" y2="180" stroke="#243942" stroke-width="2"/><line x1="192" y1="180" x2="223" y2="180" stroke="#243942" stroke-width="2"/><line x1="223" y1="158" x2="223" y2="202" stroke="#243942" stroke-width="2"/><line x1="237" y1="158" x2="237" y2="202" stroke="#243942" stroke-width="2"/><line x1="237" y1="180" x2="268" y2="180" stroke="#243942" stroke-width="2"/><text x="230" y="148" text-anchor="middle" font-size="17" fill="#243942">C₁ + C₂ = 80 μF</text><line x1="268" y1="180" x2="452" y2="180" stroke="#243942" stroke-width="2"/><line x1="452" y1="180" x2="483" y2="180" stroke="#243942" stroke-width="2"/><line x1="483" y1="158" x2="483" y2="202" stroke="#243942" stroke-width="2"/><line x1="497" y1="158" x2="497" y2="202" stroke="#243942" stroke-width="2"/><line x1="497" y1="180" x2="528" y2="180" stroke="#243942" stroke-width="2"/><text x="490" y="148" text-anchor="middle" font-size="17" fill="#243942">C₃ + C₄ = 48 μF</text><line x1="528" y1="180" x2="620" y2="180" stroke="#243942" stroke-width="2"/><line x1="100" y1="180" x2="100" y2="280" stroke="#243942" stroke-width="2"/><line x1="620" y1="180" x2="620" y2="280" stroke="#243942" stroke-width="2"/><line x1="100" y1="280" x2="325" y2="280" stroke="#243942" stroke-width="2"/><line x1="325" y1="280" x2="354" y2="280" stroke="#243942" stroke-width="2"/><line x1="354" y1="260" x2="354" y2="300" stroke="#243942" stroke-width="2"/><line x1="366" y1="269" x2="366" y2="291" stroke="#243942" stroke-width="2"/><line x1="366" y1="280" x2="395" y2="280" stroke="#243942" stroke-width="2"/><text x="343" y="252" text-anchor="middle" font-size="18" fill="#243942">+</text><text x="379" y="252" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="360" y="326" text-anchor="middle" font-size="17" fill="#243942">30 V</text><line x1="395" y1="280" x2="620" y2="280" stroke="#243942" stroke-width="2"/><text x="230" y="230" text-anchor="middle" font-size="18" fill="#243942">11.25 V</text><text x="490" y="230" text-anchor="middle" font-size="18" fill="#243942">18.75 V = V₃</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Equal series-group charge = 900 μC  •  U₃ = 6.33 mJ</text></g></svg>