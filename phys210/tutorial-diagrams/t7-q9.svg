<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Resistivity from wire dimensions</title><desc id="desc">Cylindrical wire with length two metres and diameter one millimetre; circular end shows radius is half the diameter.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Resistivity from wire dimensions</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Wire resistance depends on length and cross-sectional area.</text><rect x="110" y="160" width="400" height="80" rx="4" fill="#e0e9e8" stroke="#176b72" stroke-width="1.5"/><ellipse cx="510" cy="200" rx="22" ry="40" fill="#d2e0df" stroke="#176b72" stroke-width="2"/><line x1="110" y1="285" x2="510" y2="285" stroke="#243942" stroke-width="2"/><text x="310" y="310" text-anchor="middle" font-size="18" fill="#243942">L = 2.0 m</text><line x1="555" y1="160" x2="555" y2="240" stroke="#ad433d" stroke-width="2"/><text x="600" y="192" text-anchor="middle" font-size="16" fill="#243942">d = 1.0 mm</text><text x="600" y="218" text-anchor="middle" font-size="16" fill="#243942">r = 0.50 mm</text><text x="310" y="130" text-anchor="middle" font-size="18" fill="#243942">R = 0.45 Ω</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">ρ = Rπ(d/2)²/L = 1.77 × 10⁻⁷ Ω·m</text></g></svg>