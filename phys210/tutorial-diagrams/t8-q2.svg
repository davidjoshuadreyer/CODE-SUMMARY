<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Resistance ratio after cooling</title><desc id="desc">Cooling comparison: iron resistance drops from ten to five ohms while carbon rises from ten to ten point five ohms.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Resistance ratio after cooling</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Linear temperature model: cooling from 20 °C to −80 °C.</text><text x="220" y="105" text-anchor="middle" font-size="18" fill="#243942">20 °C</text><text x="530" y="105" text-anchor="middle" font-size="18" fill="#243942">−80 °C</text><text x="80" y="170" text-anchor="middle" font-size="18" fill="#176b72">iron</text><text x="220" y="170" text-anchor="middle" font-size="18" fill="#243942">10 Ω</text><line x1="285" y1="165" x2="440" y2="165" stroke="#176b72" stroke-width="3"/><polygon points="440,165 430.0950818741206,169.78462087522354 430.0950818741206,160.21537912477646" fill="#176b72"/><text x="530" y="170" text-anchor="middle" font-size="22" fill="#176b72">5.0 Ω</text><text x="80" y="280" text-anchor="middle" font-size="18" fill="#ad433d">carbon</text><text x="220" y="280" text-anchor="middle" font-size="18" fill="#243942">10 Ω</text><line x1="285" y1="275" x2="440" y2="275" stroke="#ad433d" stroke-width="3"/><polygon points="440,275 430.0950818741206,279.78462087522354 430.0950818741206,270.21537912477646" fill="#ad433d"/><text x="530" y="280" text-anchor="middle" font-size="22" fill="#ad433d">10.5 Ω</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">ΔT = −100 °C; Rcarbon / Riron = 10.5 / 5.0 = 2.1</text></g></svg>