<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Potential and field from a linear function</title><desc id="desc">Straight descending V versus x graph through 10, −11, and −32 volts. Uniform electric field arrow points to increasing x.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Potential and field from a linear function</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Slope of potential determines the direction of electric field.</text><line x1="115" y1="154" x2="650" y2="154" stroke="#176b72" stroke-width="3"/><polygon points="650,154 640.0950818741205,158.78462087522354 640.0950818741205,149.21537912477646" fill="#176b72"/><text x="655" y="182" text-anchor="middle" font-size="18" fill="#176b72">x (m)</text><line x1="115" y1="310" x2="115" y2="95" stroke="#176b72" stroke-width="3"/><polygon points="115,95 119.78462087522354,104.90491812587945 110.21537912477646,104.90491812587945" fill="#176b72"/><text x="65" y="90" text-anchor="middle" font-size="18" fill="#176b72">V (V)</text><line x1="115" y1="110" x2="605" y2="295" stroke="#176b72" stroke-width="3"/><circle cx="115" cy="110" r="5" fill="#176b72"/><text x="145" y="95" text-anchor="middle" font-size="17" fill="#243942">(0, 10)</text><circle cx="360" cy="202.5" r="5" fill="#176b72"/><text x="390" y="187.5" text-anchor="middle" font-size="17" fill="#243942">(3, −11)</text><circle cx="605" cy="295" r="5" fill="#176b72"/><text x="575" y="320" text-anchor="middle" font-size="17" fill="#243942">(6, −32)</text><line x1="250" y1="115" x2="470" y2="115" stroke="#176b72" stroke-width="3"/><polygon points="470,115 460.0950818741206,119.78462087522354 460.0950818741206,110.21537912477646" fill="#176b72"/><text x="360.0" y="100" text-anchor="middle" font-size="18" fill="#176b72">E = +7.00 V/m</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Eₓ = −dV/dx = −(−7.00)</text></g></svg>