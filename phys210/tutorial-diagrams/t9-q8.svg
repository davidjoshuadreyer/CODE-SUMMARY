<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 8: Distance travelled in circular motion</title><desc id="desc">Illustrative out-of-page field: magnetic force stays radial while velocity stays tangent to the orbit. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="215" cy="210" r="85" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M215,210 L300,210" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><text x="228" y="202" fill="#243943" font-size="18" text-anchor="start">2 mm</text><circle cx="110" cy="110" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="110" cy="110" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="128" y="116" fill="#243943" font-size="18" text-anchor="start">B out of page</text><circle cx="300" cy="210" r="7" fill="#b74444" stroke="#b74444" stroke-width="2.5"/><path d="M300,210 L300,290" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M300,290 L305.0,278.0 L295.0,278.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="318" y="283" fill="#243943" font-size="18" text-anchor="start">v</text><path d="M293,210 L225,210" fill="none" stroke="#b74444" stroke-width="3"/><path d="M225,210 L237.0,215.0 L237.0,205.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="230" y="241" fill="#b74444" font-size="16" text-anchor="start">F inward</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Illustrated field</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">orientation.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Proton: positive q.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">v = qBr / m</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">s = vt ≈ 48 km in 1 s</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 8</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>