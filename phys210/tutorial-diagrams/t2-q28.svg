<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Field of a semi-infinite nonuniform line</title><desc id="desc">A line extends from x₀ &gt; 0 to infinity with linear charge density λ(x) = λ₀x₀/x. Find the electric field at the origin.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T2-Q28  ·  Field of a semi-infinite nonuniform line</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M60 230L445 230" fill="none" stroke="#69777d" stroke-width="1"/>
<polygon points="445,230 435.0,225.5 435.0,234.5" fill="#69777d"/>
<circle cx="100" cy="230" r="5" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="85" y="260" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">O</text>
<path d="M240 230L440 230" fill="none" stroke="#137b80" stroke-width="9"/>
<text x="230" y="270" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">x₀</text>
<text x="420" y="270" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">∞</text>
<path d="M100 185L25 185" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="25,185 35.0,189.5 35.0,180.5" fill="#be4949"/>
<text x="50" y="160" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E</text>
<path d="M310 217L330 217" fill="none" stroke="#be4949" stroke-width="5"/>
<text x="300" y="195" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">dq</text>
<text x="300" y="270" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">dx</text>
<text x="235" y="115" font-family="Arial, sans-serif" font-size="22" fill="#253840" text-anchor="start">λ(x) = λ₀x₀/x</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Shown for positive λ₀.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Each dq creates a leftward field.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">dq = λ(x) dx</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Integrate from x₀ to ∞.</text>
</svg>