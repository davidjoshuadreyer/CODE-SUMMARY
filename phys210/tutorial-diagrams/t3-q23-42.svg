<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Electron and proton speeds in a uniform field</title><desc id="desc">An electron and proton start at rest in a uniform 520 N/C electric field. Find each speed after 48.0 ns.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q23-42  ·  Electron and proton speeds in a uniform field</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M80 90L420 90" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="420,90 410.0,85.5 410.0,94.5" fill="#69777d"/>
<path d="M80 130L420 130" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="420,130 410.0,125.5 410.0,134.5" fill="#69777d"/>
<path d="M80 170L420 170" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="420,170 410.0,165.5 410.0,174.5" fill="#69777d"/>
<text x="200" y="75" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E = 520 N/C →</text>
<circle cx="170" cy="245" r="17" fill="#fffefa" stroke="#137b80" stroke-width="2"/>
<text x="170" y="251" font-family="Arial, sans-serif" font-size="22" fill="#137b80" text-anchor="middle">−</text>
<text x="170" y="289" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">electron</text>
<circle cx="330" cy="245" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="330" y="251" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="330" y="289" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">proton</text>
<path d="M150 245L70 245" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="70,245 80.0,249.5 80.0,240.5" fill="#137b80"/>
<path d="M350 245L425 245" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="425,245 415.0,240.5 415.0,249.5" fill="#be4949"/>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Initially at rest; t = 48.0 ns</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Force magnitude = eE for both.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Speed = eEt/m</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Electron: 4.390 × 10⁶ m/s ←</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Proton: 2.391 × 10³ m/s →</text>
</svg>