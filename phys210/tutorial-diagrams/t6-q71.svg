<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Reconnect charged capacitors with reversed polarity</title><desc id="desc">Opposed charged capacitors connect in parallel. Initially negative plate of two microfarad capacitor joins final positive top node and reverses polarity.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Reconnect charged capacitors with reversed polarity</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Opposite initial polarities are connected together.</text><text x="170" y="115" text-anchor="middle" font-size="18" fill="#607278">INITIAL</text><text x="535" y="115" text-anchor="middle" font-size="18" fill="#607278">FINAL: PARALLEL</text><line x1="95" y1="165" x2="95" y2="193" stroke="#243942" stroke-width="2"/><line x1="73" y1="193" x2="117" y2="193" stroke="#243942" stroke-width="2"/><line x1="73" y1="207" x2="117" y2="207" stroke="#243942" stroke-width="2"/><line x1="95" y1="207" x2="95" y2="235" stroke="#243942" stroke-width="2"/><line x1="245" y1="165" x2="245" y2="193" stroke="#243942" stroke-width="2"/><line x1="223" y1="193" x2="267" y2="193" stroke="#243942" stroke-width="2"/><line x1="223" y1="207" x2="267" y2="207" stroke="#243942" stroke-width="2"/><line x1="245" y1="207" x2="245" y2="235" stroke="#243942" stroke-width="2"/><text x="95" y="270" text-anchor="middle" font-size="16" fill="#243942">6.00 μF</text><text x="95" y="294" text-anchor="middle" font-size="16" fill="#243942">+1500 μC top</text><text x="245" y="270" text-anchor="middle" font-size="16" fill="#243942">2.00 μF</text><text x="245" y="294" text-anchor="middle" font-size="16" fill="#243942">−500 μC top</text><line x1="305" y1="200" x2="360" y2="200" stroke="#176b72" stroke-width="3"/><polygon points="360,200 350.0950818741206,204.78462087522354 350.0950818741206,195.21537912477646" fill="#176b72"/><line x1="440" y1="165" x2="440" y2="193" stroke="#243942" stroke-width="2"/><line x1="418" y1="193" x2="462" y2="193" stroke="#243942" stroke-width="2"/><line x1="418" y1="207" x2="462" y2="207" stroke="#243942" stroke-width="2"/><line x1="440" y1="207" x2="440" y2="235" stroke="#243942" stroke-width="2"/><line x1="440" y1="165" x2="440" y2="145" stroke="#243942" stroke-width="2"/><line x1="440" y1="235" x2="440" y2="255" stroke="#243942" stroke-width="2"/><line x1="630" y1="165" x2="630" y2="193" stroke="#243942" stroke-width="2"/><line x1="608" y1="193" x2="652" y2="193" stroke="#243942" stroke-width="2"/><line x1="608" y1="207" x2="652" y2="207" stroke="#243942" stroke-width="2"/><line x1="630" y1="207" x2="630" y2="235" stroke="#243942" stroke-width="2"/><line x1="630" y1="165" x2="630" y2="145" stroke="#243942" stroke-width="2"/><line x1="630" y1="235" x2="630" y2="255" stroke="#243942" stroke-width="2"/><line x1="440" y1="145" x2="630" y2="145" stroke="#243942" stroke-width="2"/><line x1="440" y1="255" x2="630" y2="255" stroke="#243942" stroke-width="2"/><text x="420" y="150" text-anchor="middle" font-size="18" fill="#176b72">+</text><text x="420" y="260" text-anchor="middle" font-size="18" fill="#ad433d">−</text><text x="440" y="285" text-anchor="middle" font-size="16" fill="#243942">750 μC</text><text x="630" y="285" text-anchor="middle" font-size="16" fill="#243942">250 μC</text><text x="535" y="185" text-anchor="middle" font-size="16" fill="#243942">125 V</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Signed charge at top node: 1500 − 500 = 1000 μC</text></g></svg>