<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Power in the diagonal resistor</title><desc id="desc">Equivalent circuit with three ohm resistor in series with two equal six ohm return paths; left return represents original diagonal resistor.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Power in the diagonal resistor</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Equivalent return paths: diagonal 2R parallel to side + bottom.</text><line x1="100" y1="135" x2="205" y2="135" stroke="#243942" stroke-width="2"/><line x1="205" y1="135" x2="225" y2="135" stroke="#243942" stroke-width="2"/><rect x="225" y="124" width="70" height="22" rx="4" fill="white" stroke="#243942" stroke-width="1.5"/><line x1="295" y1="135" x2="315" y2="135" stroke="#243942" stroke-width="2"/><text x="260" y="111" text-anchor="middle" font-size="17" fill="#243942">R = 3 Ω</text><line x1="315" y1="135" x2="560" y2="135" stroke="#243942" stroke-width="2"/><line x1="560" y1="135" x2="560" y2="180" stroke="#243942" stroke-width="2"/><line x1="560" y1="180" x2="560" y2="196" stroke="#243942" stroke-width="2"/><rect x="550" y="196" width="20" height="48" rx="4" fill="white" stroke="#243942" stroke-width="1.5"/><line x1="560" y1="244" x2="560" y2="260" stroke="#243942" stroke-width="2"/><text x="580" y="226" text-anchor="start" font-size="17" fill="#243942">2R = 6 Ω</text><line x1="560" y1="260" x2="560" y2="295" stroke="#243942" stroke-width="2"/><line x1="100" y1="295" x2="560" y2="295" stroke="#243942" stroke-width="2"/><line x1="100" y1="135" x2="100" y2="180" stroke="#243942" stroke-width="2"/><line x1="100" y1="180" x2="100" y2="209" stroke="#243942" stroke-width="2"/><line x1="80" y1="209" x2="120" y2="209" stroke="#243942" stroke-width="2"/><line x1="89" y1="221" x2="111" y2="221" stroke="#243942" stroke-width="2"/><line x1="100" y1="221" x2="100" y2="250" stroke="#243942" stroke-width="2"/><text x="70" y="207" text-anchor="middle" font-size="18" fill="#243942">+</text><text x="70" y="230" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="60" y="263" text-anchor="middle" font-size="17" fill="#243942">12 V</text><line x1="100" y1="250" x2="100" y2="295" stroke="#243942" stroke-width="2"/><line x1="360" y1="135" x2="360" y2="180" stroke="#243942" stroke-width="2"/><line x1="360" y1="180" x2="360" y2="196" stroke="#243942" stroke-width="2"/><rect x="350" y="196" width="20" height="48" rx="4" fill="white" stroke="#243942" stroke-width="1.5"/><line x1="360" y1="244" x2="360" y2="260" stroke="#243942" stroke-width="2"/><text x="380" y="226" text-anchor="start" font-size="17" fill="#243942">2R = 6 Ω</text><line x1="360" y1="260" x2="360" y2="295" stroke="#243942" stroke-width="2"/><text x="370" y="320" text-anchor="middle" font-size="16" fill="#243942">diagonal</text><text x="570" y="320" text-anchor="middle" font-size="16" fill="#243942">side + bottom</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">6 V on both return branches → Pdiagonal = 6²/6 = 6 W</text></g></svg>