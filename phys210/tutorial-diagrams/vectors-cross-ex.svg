<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Torque uses the order R × F</title><desc id="desc">A lever at 45° crossed with a force at 180° gives positive z torque. Vectors are translated to a common origin to compare directions; schematic.</desc><rect width="760" height="380" fill="#fffefb"/><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#235d67"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a13e38"/></marker></defs><g font-family="Georgia,serif"><text x="28.0" y="36.0" fill="#242420" font-size="22" text-anchor="start">Torque uses the order R × F</text><path d="M85.0,190.0 L365.0,190.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><path d="M225.0,310.0 L225.0,70.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><text x="370.0" y="195.0" fill="#242420" font-size="16" text-anchor="start">x</text><text x="232.0" y="75.0" fill="#242420" font-size="16" text-anchor="start">y</text><path d="M225.0,190.0 L306.3,108.7" stroke="#235d67" stroke-width="2.5" fill="none"/><polygon points="306.31727983645294,108.68272016354703 296.41778489984125,112.92536085066632 302.0746391493337,118.58221510015869" fill="#235d67"/><text x="314.3" y="96.7" fill="#235d67" font-size="18" text-anchor="start">R: 2.5 m</text><path d="M225.0,190.0 L130.0,190.0" stroke="#a13e38" stroke-width="2.5" fill="none"/><polygon points="130.0,190.0 140.0,194.0 140.0,186.0" fill="#a13e38"/><text x="122.0" y="212.0" fill="#a13e38" font-size="18" text-anchor="end">F: 5.0 N</text><polyline fill="none" stroke="#746c5d" stroke-width="1.5" points="256.8,158.2 254.9,156.4 252.9,154.7 250.7,153.1 248.5,151.6 246.2,150.3 243.8,149.1 241.4,148.1 238.9,147.2 236.4,146.5 233.8,145.9 231.2,145.4 228.5,145.1 225.9,145.0 223.2,145.0 220.6,145.2 218.0,145.6 215.4,146.0 212.8,146.7 210.3,147.5 207.8,148.4 205.4,149.5 203.0,150.7 200.7,152.1 198.5,153.6 196.5,155.2 194.5,157.0 192.6,158.8 190.8,160.8 189.1,162.8 187.6,165.0 186.2,167.2 184.9,169.6 183.8,172.0 182.8,174.4 181.9,176.9 181.2,179.5 180.7,182.1 180.3,184.7 180.1,187.4 180.0,190.0"/><text x="197.8" y="124.4" fill="#625d51" font-size="17" text-anchor="middle">135°</text><text x="455.0" y="115.0" fill="#242420" font-size="17" text-anchor="start">CROSS PRODUCT</text><text x="455.0" y="155.0" fill="#242420" font-size="25" text-anchor="start">τ = R × F</text><text x="455.0" y="201.0" fill="#242420" font-size="18" text-anchor="start">Rotate R toward F</text><text x="455.0" y="229.0" fill="#242420" font-size="18" text-anchor="start">Counterclockwise → +z</text><text x="455.0" y="257.0" fill="#242420" font-size="18" text-anchor="start">τ points out of the xy plane.</text><text x="28.0" y="356.0" fill="#242420" font-size="16" text-anchor="start">Directions follow the stated coordinate system; arrow lengths are schematic.</text></g></svg>