<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 5: Current required for loop torque</title><desc id="desc">Edge-on loop view distinguishes the 40° plane angle from the complementary normal angle. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M160,220 L370,220" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M370,220 L358.0,215.0 L358.0,225.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="350" y="208" fill="#243943" font-size="18" text-anchor="start">B</text><path d="M85,157.067527661704 L290,329.08295205304637" fill="none" stroke="#243943" stroke-width="4"/><text x="245" y="350" fill="#243943" font-size="17" text-anchor="start">loop plane</text><path d="M160,220 L237.1345131623847,128.07466682572266" fill="none" stroke="#b74444" stroke-width="3"/><path d="M237.1345131623847,128.07466682572266 L225.59083963055136,134.0532620947177 L233.25128406174113,140.4811381915831 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="235" y="105" fill="#b74444" font-size="17" text-anchor="start">normal n</text><text x="255" y="252" fill="#243943" font-size="18" text-anchor="start">θ = 40°</text><text x="230" y="180" fill="#b74444" font-size="17" text-anchor="start">50°</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Edge-on view of loop.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Angle to plane: 40°</text><text x="440" y="182" fill="#243943" font-size="18" text-anchor="start">Angle to normal: 50°</text><text x="440" y="223" fill="#243943" font-size="18" text-anchor="start">τ = NIAB sin(90° − θ)</text><text x="440" y="264" fill="#243943" font-size="18" text-anchor="start">I = 74.6 A</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 5</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>