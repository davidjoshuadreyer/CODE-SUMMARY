<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 2: Net force on an L-shaped wire</title><desc id="desc">Current follows the L-shaped path. Segment forces are downward and rightward. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M90,280 L260,280" fill="none" stroke="#087f8c" stroke-width="5"/><path d="M260,280 L260,100" fill="none" stroke="#087f8c" stroke-width="5"/><path d="M120,280 L210,280" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M210,280 L198.0,275.0 L198.0,285.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M260,240 L260,145" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M260,145 L255.0,157.0 L265.0,157.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="110" y="310" fill="#243943" font-size="18" text-anchor="start">2 m</text><text x="278" y="210" fill="#243943" font-size="18" text-anchor="start">3 m</text><text x="70" y="255" fill="#243943" font-size="18" text-anchor="start">start</text><text x="270" y="95" fill="#243943" font-size="18" text-anchor="start">end</text><circle cx="100" cy="100" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="100" cy="100" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="118" y="106" fill="#243943" font-size="18" text-anchor="start">B = +z</text><path d="M170,260 L170,330" fill="none" stroke="#b74444" stroke-width="3"/><path d="M170,330 L175.0,318.0 L165.0,318.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><path d="M275,170 L365,170" fill="none" stroke="#b74444" stroke-width="3"/><path d="M365,170 L353.0,165.0 L353.0,175.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">I = 25 A; B = 40 mT</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Horizontal: Fᵧ = −2 N</text><text x="440" y="182" fill="#243943" font-size="18" text-anchor="start">Vertical: Fₓ = +3 N</text><text x="440" y="223" fill="#243943" font-size="18" text-anchor="start">Net magnitude = 3.61 N</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 2</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>