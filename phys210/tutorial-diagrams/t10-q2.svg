<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 2: Superposition from three parallel wires</title><desc id="desc">Current directions in three parallel wires determine the signed into-page field at the origin. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M65,105 L365,105" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M140,105 L290,105" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M290,105 L278.0,100.0 L278.0,110.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="90" y="89" fill="#243943" font-size="17" text-anchor="start">y = +2 m; 80 A</text><path d="M65,235 L365,235" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M290,235 L140,235" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M140,235 L152.0,240.0 L152.0,230.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="90" y="219" fill="#243943" font-size="17" text-anchor="start">y = −1 m; 60 A</text><path d="M65,305 L365,305" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M140,305 L290,305" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M290,305 L278.0,300.0 L278.0,310.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="90" y="289" fill="#243943" font-size="17" text-anchor="start">y = −3 m; 20 A</text><circle cx="220" cy="175" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M215,170 L225,180" fill="none" stroke="#71828a" stroke-width="2"/><path d="M215,180 L225,170" fill="none" stroke="#71828a" stroke-width="2"/><text x="238" y="181" fill="#243943" font-size="18" text-anchor="start">origin: B net</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Rightward is +x.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">At origin, signed B_z:</text><text x="440" y="182" fill="#243943" font-size="18" text-anchor="start">−8 − 12 + 1.33 μT</text><text x="440" y="223" fill="#243943" font-size="18" text-anchor="start">= −18.67 μT (into page)</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 2</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>