<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Convert displacement to metres</title><desc id="desc">The 15 N force is 10° above the 1.15 m displacement. Arrow lengths are schematic.</desc><rect width="760" height="380" fill="#fffefb"/><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#235d67"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a13e38"/></marker></defs><g font-family="Georgia,serif"><text x="28.0" y="36.0" fill="#242420" font-size="22" text-anchor="start">Convert displacement to metres</text><path d="M85.0,190.0 L365.0,190.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><path d="M225.0,310.0 L225.0,70.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><text x="370.0" y="195.0" fill="#242420" font-size="16" text-anchor="start">x</text><text x="232.0" y="75.0" fill="#242420" font-size="16" text-anchor="start">y</text><path d="M225.0,190.0 L338.3,170.0" stroke="#235d67" stroke-width="2.5" fill="none"/><polygon points="338.2528915964039,170.030459568303 327.7102213556141,167.8277103329235 329.0994067769496,175.70617235702113" fill="#235d67"/><text x="346.3" y="158.0" fill="#235d67" font-size="18" text-anchor="start">F: 15 N</text><path d="M225.0,190.0 L320.0,190.0" stroke="#a13e38" stroke-width="2.5" fill="none"/><polygon points="320.0,190.0 310.0,186.0 310.0,194.0" fill="#a13e38"/><text x="328.0" y="212.0" fill="#a13e38" font-size="18" text-anchor="start">d: 1.15 m</text><polyline fill="none" stroke="#746c5d" stroke-width="1.5" points="269.3,182.2 269.4,182.4 269.4,182.6 269.4,182.8 269.4,183.0 269.5,183.2 269.5,183.3 269.5,183.5 269.6,183.7 269.6,183.9 269.6,184.1 269.6,184.3 269.7,184.5 269.7,184.7 269.7,184.9 269.7,185.1 269.8,185.3 269.8,185.5 269.8,185.7 269.8,185.9 269.8,186.1 269.8,186.3 269.9,186.5 269.9,186.7 269.9,186.9 269.9,187.1 269.9,187.3 269.9,187.4 269.9,187.6 269.9,187.8 270.0,188.0 270.0,188.2 270.0,188.4 270.0,188.6 270.0,188.8 270.0,189.0 270.0,189.2 270.0,189.4 270.0,189.6 270.0,189.8 270.0,190.0"/><text x="295.7" y="165.8" fill="#625d51" font-size="17" text-anchor="middle">10°</text><text x="455.0" y="115.0" fill="#242420" font-size="17" text-anchor="start">DOT PRODUCT</text><text x="455.0" y="155.0" fill="#242420" font-size="25" text-anchor="start">W = F · d</text><text x="455.0" y="201.0" fill="#242420" font-size="18" text-anchor="start">115 cm = 1.15 m</text><text x="455.0" y="229.0" fill="#242420" font-size="18" text-anchor="start">W = 15(1.15) cos 10°</text><text x="28.0" y="356.0" fill="#242420" font-size="16" text-anchor="start">Directions follow the stated coordinate system; arrow lengths are schematic.</text></g></svg>