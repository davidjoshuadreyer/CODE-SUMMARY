<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Magnitude of a vector combination</title><desc id="desc">A = 12i − 16j and B = −24i + 10j. Find |C| for C = 2A − B.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T1-Q4  ·  Magnitude of a vector combination</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M120 130L440 130" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="440,130 430.0,125.5 430.0,134.5" fill="#69777d"/>
<path d="M120 130L120 65" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="120,65 115.5,75.0 124.5,75.0" fill="#69777d"/>
<path d="M120 130L240 210" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="240,210 234.1756479396351,200.7087717132274 229.18334617360802,208.197224362268" fill="#137b80"/>
<path d="M240 210L360 235" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="360,235 351.12798994612797,228.55504557006077 349.29240165911995,237.36586934769923" fill="#be4949"/>
<path d="M120 130L360 235" fill="none" stroke="#253840" stroke-width="3"/>
<polygon points="360,235 352.64211140406684,226.86910365274306 349.03474189788943,235.11451966686278" fill="#253840"/>
<text x="95" y="245" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">2A = (24, −32)</text>
<text x="325" y="305" font-family="Arial, sans-serif" font-size="18" fill="#be4949" text-anchor="start">−B</text>
<text x="250" y="275" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">C = (48, −42)</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Head-to-tail addition:</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">C = 2A + (−B)</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">|C| = √(48² + 42²)</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">|C| = 63.78</text>
</svg>