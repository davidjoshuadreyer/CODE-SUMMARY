<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">A rim force acts through the radius</title><desc id="desc">The force acts downward at the right rim. The 0.140 m radius gives clockwise torque into the page. Schematic.</desc><rect width="760" height="380" fill="#fffefb"/><defs><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#235d67"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a13e38"/></marker></defs><g font-family="Georgia,serif"><text x="28.0" y="36.0" fill="#242420" font-size="22" text-anchor="start">A rim force acts through the radius</text><path d="M100.0,195.0 L370.0,195.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><path d="M235.0,310.0 L235.0,80.0" stroke="#b9b7b0" stroke-width="2.5" fill="none"/><text x="375.0" y="200.0" fill="#242420" font-size="16" text-anchor="start">x</text><text x="242.0" y="85.0" fill="#242420" font-size="16" text-anchor="start">y</text><circle cx="235" cy="195" r="90" fill="none" stroke="#235d67" stroke-width="2"/><path d="M235.0,195.0 L325.0,195.0" stroke="#235d67" stroke-width="2.5" fill="none" stroke-dasharray="5 5"/><path d="M325.0,195.0 L325.0,295.0" stroke="#a13e38" stroke-width="2.5" fill="none"/><polygon points="325,295 329.0,285.0 321.0,285.0" fill="#a13e38"/><text x="258.0" y="178.0" fill="#235d67" font-size="17" text-anchor="start">0.140 m</text><text x="340.0" y="280.0" fill="#a13e38" font-size="18" text-anchor="start">10 N</text><text x="455.0" y="130.0" fill="#242420" font-size="20" text-anchor="start">Diameter = 28.0 cm</text><text x="455.0" y="175.0" fill="#242420" font-size="18" text-anchor="start">Use half the diameter.</text><text x="455.0" y="220.0" fill="#242420" font-size="20" text-anchor="start">Clockwise rotation</text><text x="455.0" y="255.0" fill="#242420" font-size="18" text-anchor="start">τ points into the page (−z).</text><text x="28.0" y="356.0" fill="#242420" font-size="16" text-anchor="start">Directions follow the stated coordinate system; arrow lengths are schematic.</text></g></svg>