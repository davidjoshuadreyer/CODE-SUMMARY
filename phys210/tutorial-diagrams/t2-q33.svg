<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Field at the center of a negative semicircular rod</title><desc id="desc">A 0.140 m insulating rod is bent into the left half of a circle. It carries uniform charge −7.50 μC. Find the field at its center O.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T2-Q33  ·  Field at the center of a negative semicircular rod</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M260 90 A120 120 0 0 0 260 330" fill="none" stroke="#137b80" stroke-width="6"/>
<circle cx="260" cy="210" r="5" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="275" y="215" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">O</text>
<path d="M260 210L150 210" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="150,210 160.0,214.5 160.0,205.5" fill="#be4949"/>
<text x="190" y="190" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E</text>
<path d="M260 210L175 125" fill="none" stroke="#69777d" stroke-width="1" stroke-dasharray="6 5"/>
<path d="M260 210L175 295" fill="none" stroke="#69777d" stroke-width="1" stroke-dasharray="6 5"/>
<text x="80" y="195" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">−</text>
<text x="165" y="105" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">−</text>
<text x="165" y="330" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">−</text>
<text x="310" y="125" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">R = L/π</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Left semicircle: Q &lt; 0</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Vertical field components cancel.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Horizontal components add left.</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">L = 0.140 m is arc length.</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">E = 2k|Q| / (πR²)</text>
</svg>