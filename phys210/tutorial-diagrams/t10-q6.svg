<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 6: Field inside a coaxial conducting shell</title><desc id="desc">The dashed Amperian circle encloses only part of the conducting annulus plus the central wire. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="215" cy="200" r="110" fill="#dcefed" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="200" r="55.0" fill="#fcfbf7" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="200" r="82.5" fill="none" stroke="#b74444" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M215,200 L325,200" fill="none" stroke="#71828a" stroke-width="2"/><text x="277" y="223" fill="#243943" font-size="16" text-anchor="start">b = 4 mm</text><path d="M215,200 L215,145.0" fill="none" stroke="#71828a" stroke-width="2"/><text x="230" y="177" fill="#243943" font-size="16" text-anchor="start">a = 2 mm</text><text x="110" y="335" fill="#b74444" font-size="17" text-anchor="start">Dashed circle: r = 3 mm</text><circle cx="215" cy="200" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="200" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Cross-section of</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">conductor.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Enclosed shell current =</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">10 A.</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">Central +24 A; shell −24</text><text x="440" y="257" fill="#243943" font-size="18" text-anchor="start">A.</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">Net enclosed = 14 A; B =</text><text x="440" y="323" fill="#243943" font-size="18" text-anchor="start">0.933 mT.</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 6</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>