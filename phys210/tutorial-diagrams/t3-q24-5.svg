<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Flux through coordinate-plane surfaces</title><desc id="desc">A uniform field E = ai + bj intersects area A. Find flux if the surface lies in (a) yz, (b) xz, (c) xy. Specify the normal convention.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q24-5  ·  Flux through coordinate-plane surfaces</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M90 75L90 135" fill="none" stroke="#137b80" stroke-width="7"/>
<path d="M90 105L185 105" fill="none" stroke="#be4949" stroke-width="2"/>
<polygon points="185,105 175.0,100.5 175.0,109.5" fill="#be4949"/>
<text x="205" y="100" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">yz plane; n = +i</text>
<text x="205" y="129" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">Φ = aA</text>
<path d="M90 175L90 235" fill="none" stroke="#137b80" stroke-width="7"/>
<path d="M90 205L185 205" fill="none" stroke="#be4949" stroke-width="2"/>
<polygon points="185,205 175.0,200.5 175.0,209.5" fill="#be4949"/>
<text x="205" y="200" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">xz plane; n = +j</text>
<text x="205" y="229" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">Φ = bA</text>
<path d="M90 275L90 335" fill="none" stroke="#137b80" stroke-width="7"/>
<path d="M90 305L185 305" fill="none" stroke="#be4949" stroke-width="2"/>
<polygon points="185,305 175.0,300.5 175.0,309.5" fill="#be4949"/>
<text x="205" y="300" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">xy plane; n = +k</text>
<text x="205" y="329" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">Φ = 0</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">E = ai + bj</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Flux = E · n A</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Only normal component counts.</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Reversing n reverses flux.</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Each row is an edge-on view.</text>
</svg>