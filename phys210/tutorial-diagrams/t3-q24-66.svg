<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Net flux and enclosed charge in a nonuniform field</title><desc id="desc">A rectangular closed surface has height a = 0.400 m, depth b = 0.400 m and x-length c = 0.600 m. Its left face is at x = a and right face at x = a+c. E = (3.0+2.0x²)i N/C, with x in metres. Find net outward flux and enclosed charge.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q24-66  ·  Net flux and enclosed charge in a nonuniform field</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M110 300 L360 300 L360 140 L110 140 Z M110 140 L165 90 L415 90 L415 250 L360 300 M360 140 L415 90" fill="none" stroke="#137b80" stroke-width="2"/>
<path d="M45 220L155 220" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="155,220 145.0,215.5 145.0,224.5" fill="#be4949"/>
<path d="M350 220L465 220" fill="none" stroke="#be4949" stroke-width="5"/>
<polygon points="465,220 455.0,215.5 455.0,224.5" fill="#be4949"/>
<text x="35" y="125" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">3.32 N/C</text>
<text x="335" y="65" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">5.00 N/C</text>
<text x="80" y="335" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">xL = 0.400 m</text>
<text x="280" y="335" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">xR = 1.000 m</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Each end face: A = 0.160 m²</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">E points +x at both ends.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Left outward normal: −x</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Right outward normal: +x</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Φ = A(ER − EL) = 0.2688</text>
</svg>