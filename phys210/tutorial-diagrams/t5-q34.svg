<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Energy of a four-charge rectangle</title><desc id="desc">Rectangle with correct signed corner charges and all four edges plus both diagonals indicating the six energy pairs.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Energy of a four-charge rectangle</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Assembly energy includes six distinct pairs.</text><line x1="165" y1="130" x2="535" y2="130" stroke="#243942" stroke-width="2"/><line x1="165" y1="285" x2="535" y2="285" stroke="#243942" stroke-width="2"/><line x1="165" y1="130" x2="165" y2="285" stroke="#243942" stroke-width="2"/><line x1="535" y1="130" x2="535" y2="285" stroke="#243942" stroke-width="2"/><line x1="165" y1="130" x2="535" y2="285" stroke="#607278" stroke-width="2" stroke-dasharray="6 5"/><line x1="165" y1="285" x2="535" y2="130" stroke="#607278" stroke-width="2" stroke-dasharray="6 5"/><circle cx="165" cy="130" r="19" fill="#176b72"/><text x="165" y="136" text-anchor="middle" font-size="23" fill="white">+</text><text x="165" y="174" text-anchor="middle" font-size="18" fill="#243942">+q</text><circle cx="535" cy="130" r="19" fill="#ad433d"/><text x="535" y="136" text-anchor="middle" font-size="23" fill="white">−</text><text x="535" y="174" text-anchor="middle" font-size="18" fill="#243942">−2q</text><circle cx="165" cy="285" r="19" fill="#176b72"/><text x="165" y="291" text-anchor="middle" font-size="23" fill="white">+</text><text x="165" y="329" text-anchor="middle" font-size="18" fill="#243942">+2q</text><circle cx="535" cy="285" r="19" fill="#176b72"/><text x="535" y="291" text-anchor="middle" font-size="23" fill="white">+</text><text x="535" y="329" text-anchor="middle" font-size="18" fill="#243942">+3q</text><text x="350" y="110" text-anchor="middle" font-size="18" fill="#243942">b = 0.400 m</text><text x="80" y="210" text-anchor="middle" font-size="16" fill="#243942">a = 0.200 m</text><rect x="267" y="187" width="166" height="38" rx="4" fill="#fffefa" stroke="#607278" stroke-width="1.5"/><text x="350" y="212" text-anchor="middle" font-size="18" fill="#243942">D = 0.447 m</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">q = 6.00 μC  •  U = Σ kqᵢqⱼ / rᵢⱼ = −3.96 J</text></g></svg>