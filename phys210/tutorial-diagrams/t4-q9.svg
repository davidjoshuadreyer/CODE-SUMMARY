<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Induced charge density on a conductor’s inner surface</title><desc id="desc">A +6.0 nC point charge lies at the center of a conducting spherical shell with inner radius 1.0 cm, outer radius 2.0 cm and net shell charge −4.0 nC. Find the inner-surface charge density.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T4-Q9  ·  Induced charge density on a conductor’s inner surface</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<circle cx="230" cy="210" r="100" fill="#dfe8e7" stroke="#137b80" stroke-width="2"/>
<circle cx="230" cy="210" r="50" fill="#fffefa" stroke="#137b80" stroke-width="2"/>
<circle cx="230" cy="210" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="230" y="216" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="230" y="254" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle"></text>
<circle cx="230" cy="210" r="75" fill="none" stroke="#be4949" stroke-width="2" stroke-dasharray="6 5"/>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Spherical conductor</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Center: +6 nC</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Inner surface: −6 nC</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Outer surface: +2 nC</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Metal: E = 0 → Qenc = 0</text>
<text x="160" y="355" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Inner 1 cm · outer 2 cm</text>
