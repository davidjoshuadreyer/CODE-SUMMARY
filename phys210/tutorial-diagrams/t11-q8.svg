<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 8: Voltage at the midpoint of a rotating rod</title><desc id="desc">Velocity grows with distance from the pivot. Positive charge is pushed inward; the requested integral stops at the rod midpoint. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M75,250 L365,250" fill="none" stroke="#087f8c" stroke-width="7"/><circle cx="75" cy="250" r="7" fill="#243943" stroke="#243943" stroke-width="2.5"/><circle cx="220" cy="250" r="6" fill="#b74444" stroke="#b74444" stroke-width="2.5"/><text x="60" y="285" fill="#243943" font-size="18" text-anchor="start">P (+)</text><text x="195" y="285" fill="#243943" font-size="18" text-anchor="start">A</text><text x="320" y="285" fill="#243943" font-size="17" text-anchor="start">end</text><path d="M220,240 L220,155" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,155 L215.0,167.0 L225.0,167.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M365,240 L365,100" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M365,100 L360.0,112.0 L370.0,112.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="245" y="152" fill="#243943" font-size="17" text-anchor="start">v = ωr</text><path d="M210,225 L100,225" fill="none" stroke="#b74444" stroke-width="3"/><path d="M100,225 L112.0,230.0 L112.0,220.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><circle cx="120" cy="120" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M115,115 L125,125" fill="none" stroke="#71828a" stroke-width="2"/><path d="M115,125 L125,115" fill="none" stroke="#71828a" stroke-width="2"/><text x="138" y="126" fill="#243943" font-size="18" text-anchor="start">B into page</text><path d="M75,315 L220,315" fill="none" stroke="#71828a" stroke-width="2"/><text x="87" y="340" fill="#243943" font-size="17" text-anchor="start">L/2 = 0.20 m</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Counterclockwise</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">rotation.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Force on positive charge</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">points inward.</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">Integrate P to midpoint</text><text x="440" y="257" fill="#243943" font-size="18" text-anchor="start">A.</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">V_A − V_P = −8.0 mV</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 8</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>