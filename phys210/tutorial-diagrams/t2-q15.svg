<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Zero field outside two opposite charges</title><desc id="desc">A −2.50 μC charge is at x = 0 and a +6.00 μC charge at x = 1.00 m. Find the finite point where E = 0.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T2-Q15  ·  Zero field outside two opposite charges</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M40 210L440 210" fill="none" stroke="#69777d" stroke-width="1"/>
<polygon points="440,210 430.0,205.5 430.0,214.5" fill="#69777d"/>
<circle cx="90" cy="210" r="5" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="50" y="255" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E = 0</text>
<circle cx="255" cy="210" r="17" fill="#fffefa" stroke="#137b80" stroke-width="2"/>
<text x="255" y="216" font-family="Arial, sans-serif" font-size="22" fill="#137b80" text-anchor="middle">−</text>
<text x="255" y="254" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">−2.50 μC</text>
<circle cx="410" cy="210" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="410" y="216" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="410" y="254" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">+6.00 μC</text>
<path d="M90 155L170 155" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="170,155 160.0,150.5 160.0,159.5" fill="#137b80"/>
<path d="M90 125L10 125" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="10,125 20.0,129.5 20.0,120.5" fill="#be4949"/>
<text x="120" y="145" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E₋</text>
<text x="25" y="110" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E₊</text>
<text x="160" y="300" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">d = 1.821 m</text>
<text x="315" y="300" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">1.00 m</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Cancellation is left of x = 0.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Between charges, fields add.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">2.50/d² = 6.00/(d + 1)²</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">x = −1.821 m</text>
</svg>