<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 7: Combine wire and solenoid fields</title><desc id="desc">At the interior point, the wire field is tangential and the solenoid field is axial, so they add orthogonally. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="215" cy="205" r="110" fill="none" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="205" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="205" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><circle cx="285" cy="205" r="5" fill="#b74444" stroke="#b74444" stroke-width="2.5"/><text x="290" y="235" fill="#243943" font-size="17" text-anchor="start">P</text><path d="M215,205 L280,205" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><text x="230" y="190" fill="#243943" font-size="16" text-anchor="start">2 cm</text><path d="M285,202 L285,125" fill="none" stroke="#b74444" stroke-width="3"/><path d="M285,125 L280.0,137.0 L290.0,137.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="300" y="140" fill="#b74444" font-size="16" text-anchor="start">B_wire</text><text x="110" y="340" fill="#243943" font-size="16" text-anchor="start">Cross-section; solenoid radius 3 cm</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Illustrated wire current:</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">out of page.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Solenoid B is axial (±</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">out of page).</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">Wire B is tangential.</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">33.93 ⟂ 30.0 μT → 45.29</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">μT</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 7</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>