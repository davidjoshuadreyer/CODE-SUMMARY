.21537912477646 204.90491812587945,329.78462087522354" fill="#176b72"/><text x="100" y="330" text-anchor="middle" font-size="18" fill="#176b72">1.6 A</text><text x="480" y="95" text-anchor="middle" font-size="17" fill="#243942">VT = 14 V</text><text x="620" y="300" text-anchor="middle" font-size="17" fill="#243942">0 V</text><text x="85" y="285" text-anchor="middle" font-size="17" fill="#243942">−16 V</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Current through 10 Ω flows from 0 V toward −16 V.</text></g></svg>