<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Direction of current in a resistor branch</title><desc id="desc">Three-branch circuit has thirty and fifty volt sources positive at top. Given middle upward current sets top voltage fourteen volts and left bottom node negative sixteen volts.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Direction of current in a resistor branch</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Redrawn original nodes and polarities; bottom node is 0 V.</text><line x1="145" y1="105" x2="570" y2="105" stroke="#243942" stroke-width="2"/><line x1="145" y1="105" x2="145" y2="175" stroke="#243942" stroke-width="2"/><line x1="145" y1="175" x2="145" y2="204" stroke="#243942" stroke-width="2"/><line x1="125" y1="204" x2="165" y2="204" stroke="#243942" stroke-width="2"/><line x1="134" y1="216" x2="156" y2="216" stroke="#243942" stroke-width="2"/><line x1="145" y1="216" x2="145" y2="245" stroke="#243942" stroke-width="2"/><text x="115" y="202" text-anchor="middle" font-size="18" fill="#243942">+</text><text x="115" y="225" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="105" y="258" text-anchor="middle" font-size="17" fill="#243942">30 V</text><line x1="145" y1="245" x2="145" y2="295" stroke="#243942" stroke-width="2"/><line x1="145" y1="295" x2="205" y2="295" stroke="#243942" stroke-width="2"/><line x1="205" y1="295" x2="225" y2="295" stroke="#243942" stroke-width="2"/><rect x="225" y="284" width="70" height="22" rx="4" fill="white" stroke="#243942" stroke-width="1.5"/><line x1="295" y1="295" x2="315" y2="295" stroke="#243942" stroke-width="2"/><text x="260" y="271" text-anchor="middle" font-size="17" fill="#243942">10 Ω</text><line x1="315" y1="295" x2="570" y2="295" stroke="#243942" stroke-width="2"/><line x1="350" y1=