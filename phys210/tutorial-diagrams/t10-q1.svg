<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 1: Perpendicular fields of two long wires</title><desc id="desc">The observation point is two metres from each perpendicular wire. Their field contributions are orthogonal. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M70,300 L360,300" fill="none" stroke="#087f8c" stroke-width="4"/><text x="80" y="327" fill="#243943" font-size="17" text-anchor="start">30 A wire along x</text><circle cx="200" cy="95" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="200" cy="95" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="218" y="101" fill="#243943" font-size="18" text-anchor="start">40 A wire</text><circle cx="200" cy="200" r="5" fill="#b74444" stroke="#b74444" stroke-width="2.5"/><text x="215" y="205" fill="#243943" font-size="17" text-anchor="start">P (0, 2, 0)</text><path d="M165,100 L165,195" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><path d="M165,205 L165,295" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><text x="105" y="155" fill="#243943" font-size="18" text-anchor="start">2 m</text><text x="105" y="255" fill="#243943" font-size="18" text-anchor="start">2 m</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Current signs not</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">specified.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">At P: B₁ along ±z, B₂</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">along ±x.</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">Orthogonal magnitudes: 3</text><text x="440" y="257" fill="#243943" font-size="18" text-anchor="start">μT and 4 μT.</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">Net magnitude: 5 μT</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 1</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>