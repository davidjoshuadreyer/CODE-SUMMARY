<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Potential change along a circuit segment</title><desc id="desc">Circuit segment from A through twenty volt rise, twenty ohm resistor voltage drop, and twelve volt drop to B. Current points A to B.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Potential change along a circuit segment</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Walk from A to B and add the signed potential changes.</text><text x="45" y="190" text-anchor="middle" font-size="22" fill="#243942">A</text><line x1="65" y1="185" x2="130" y2="185" stroke="#243942" stroke-width="2"/><line x1="130" y1="185" x2="159" y2="185" stroke="#243942" stroke-width="2"/><line x1="159" y1="165" x2="159" y2="205" stroke="#243942" stroke-width="2"/><line x1="171" y1="174" x2="171" y2="196" stroke="#243942" stroke-width="2"/><line x1="171" y1="185" x2="200" y2="185" stroke="#243942" stroke-width="2"/><text x="148" y="157" text-anchor="middle" font-size="18" fill="#243942">+</text><text x="184" y="157" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="165" y="231" text-anchor="middle" font-size="17" fill="#243942">20 V</text><rect x="127" y="145" width="77" height="75" rx="4" fill="#fffefa" stroke="#fffefa" stroke-width="1.5"/><line x1="130" y1="185" x2="159" y2="185" stroke="#243942" stroke-width="2"/><line x1="159" y1="174" x2="159" y2="196" stroke="#243942" stroke-width="2"/><line x1="171" y1="165" x2="171" y2="205" stroke="#243942" stroke-width="2"/><line x1="171" y1="185" x2="200" y2="185" stroke="#243942" stroke-width="2"/><text x="148" y="155" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="184" y="155" text-anchor="middle" font-size="18" fill="#243942">+</text><line x1="200" y1="185" x2="305" y2="185" stroke="#243942" stroke-width="2"/><line x1="305" y1="185" x2="325" y2="185" stroke="#243942" stroke-width="2"/><rect x="325" y="174" width="70" height="22" rx="4" fill="white" stroke="#243942" stroke-width="1.5"/><line x1="395" y1="185" x2="415" y2="185" stroke="#243942" stroke-width="2"/><text x="360" y="161" text-anchor="middle" font-size="17" fill="#243942">20 Ω</text><line x1="415" y1="185" x2="500" y2="185" stroke="#243942" stroke-width="2"/><line x1="500" y1="185" x2="529" y2="185" stroke="#243942" stroke-width="2"/><line x1="529" y1="165" x2="529" y2="205" stroke="#243942" stroke-width="2"/><line x1="541" y1="174" x2="541" y2="196" stroke="#243942" stroke-width="2"/><line x1="541" y1="185" x2="570" y2="185" stroke="#243942" stroke-width="2"/><text x="518" y="157" text-anchor="middle" font-size="18" fill="#243942">+</text><text x="554" y="157" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="535" y="231" text-anchor="middle" font-size="17" fill="#243942">12 V</text><line x1="570" y1="185" x2="655" y2="185" stroke="#243942" stroke-width="2"/><text x="675" y="190" text-anchor="middle" font-size="22" fill="#243942">B</text><line x1="245" y1="110" x2="475" y2="110" stroke="#176b72" stroke-width="3"/><polygon points="475,110 465.0950818741206,114.78462087522354 465.0950818741206,105.21537912477646" fill="#176b72"/><text x="360.0" y="90" text-anchor="middle" font-size="18" fill="#176b72">I = 1.5 A</text><text x="165" y="285" text-anchor="middle" font-size="22" fill="#176b72">+20 V</text><text x="360" y="285" text-anchor="middle" font-size="22" fill="#ad433d">−30 V</text><text x="535" y="285" text-anchor="middle" font-size="22" fill="#ad433d">−12 V</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">VB − VA = +20 − 30 − 12 = −22 V</text></g></svg>