<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Parallel plates: field, charge and capacitance</title><desc id="desc">Parallel plates separated 1.80 millimetres with uniform field arrows from positive left plate to negative right plate.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Parallel plates: field, charge and capacitance</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Air-filled parallel plates; neglect edge effects.</text><line x1="240.0" y1="145" x2="240.0" y2="255" stroke="#176b72" stroke-width="4"/><line x1="460.0" y1="145" x2="460.0" y2="255" stroke="#ad433d" stroke-width="4"/><text x="222.0" y="200" text-anchor="middle" font-size="22" fill="#176b72">+</text><text x="478.0" y="200" text-anchor="middle" font-size="22" fill="#ad433d">−</text><text x="350" y="285" text-anchor="middle" font-size="18" fill="#243942">d = 1.80 mm</text><line x1="260" y1="155" x2="440" y2="155" stroke="#176b72" stroke-width="3"/><polygon points="440,155 430.0950818741206,159.78462087522354 430.0950818741206,150.21537912477646" fill="#176b72"/><line x1="260" y1="200" x2="440" y2="200" stroke="#176b72" stroke-width="3"/><polygon points="440,200 430.0950818741206,204.78462087522354 430.0950818741206,195.21537912477646" fill="#176b72"/><line x1="260" y1="245" x2="440" y2="245" stroke="#176b72" stroke-width="3"/><polygon points="440,245 430.0950818741206,249.78462087522354 430.0950818741206,240.21537912477646" fill="#176b72"/><text x="155" y="145" text-anchor="middle" font-size="17" fill="#243942">+Q = 74.8 pC</text><text x="555" y="145" text-anchor="middle" font-size="17" fill="#243942">−Q = −74.8 pC</text><text x="350" y="100" text-anchor="middle" font-size="18" fill="#243942">A = 7.60 cm²</text><text x="350" y="320" text-anchor="middle" font-size="18" fill="#243942">E = 1.11 × 10⁴ V/m</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">ΔV = 20.0 V  •  C = ε₀A/d = 3.74 pF</text></g></svg>