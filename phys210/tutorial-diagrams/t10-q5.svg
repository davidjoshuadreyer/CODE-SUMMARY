<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 5: Force on one of three equidistant wires</title><desc id="desc">For the top wire, equal attractive forces combine toward the midpoint of the opposite side. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M215 105 L100 305 L330 305 Z" stroke="#71828a" stroke-width="1" fill="none"/><circle cx="215" cy="105" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="105" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><circle cx="100" cy="305" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="100" cy="305" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><circle cx="330" cy="305" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="330" cy="305" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><path d="M208,120 L160,205" fill="none" stroke="#b74444" stroke-width="3"/><path d="M160,205 L170.25440377232067,197.0095555020878 L161.54686810151892,192.09235888798796 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><path d="M222,120 L270,205" fill="none" stroke="#b74444" stroke-width="3"/><path d="M270,205 L268.4531318984811,192.09235888798798 L259.7455962276793,197.00955550208778 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><path d="M215,135 L215,255" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M215,255 L220.0,243.0 L210.0,243.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="230" y="250" fill="#243943" font-size="17" text-anchor="start">net F</text><text x="80" y="345" fill="#243943" font-size="17" text-anchor="start">Each side R = 6 mm</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">All currents: 5 A out of</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">page.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Each pair attracts.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Two equal forces, 60°</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">apart.</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">Net = √3 F₀ = 2.89 mN</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 5</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>