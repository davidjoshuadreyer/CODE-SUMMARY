<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 7: Polarity of a moving bar near a wire</title><desc id="desc">Positive charges are driven toward the left end A as the bar moves upward through the into-page field. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M365,300 L65,300" fill="none" stroke="#243943" stroke-width="3"/><path d="M65,300 L77.0,305.0 L77.0,295.0 Z" stroke="#243943" stroke-width="1" fill="#243943"/><text x="130" y="335" fill="#243943" font-size="17" text-anchor="start">wire: I = 50 A left</text><path d="M90,180 L350,180" fill="none" stroke="#087f8c" stroke-width="7"/><text x="75" y="165" fill="#b74444" font-size="18" text-anchor="start">A +</text><text x="330" y="165" fill="#243943" font-size="18" text-anchor="start">B −</text><path d="M220,170 L220,90" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M220,90 L215.0,102.0 L225.0,102.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="238" y="110" fill="#243943" font-size="17" text-anchor="start">v ↑</text><circle cx="140" cy="240" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M135,235 L145,245" fill="none" stroke="#71828a" stroke-width="2"/><path d="M135,245 L145,235" fill="none" stroke="#71828a" stroke-width="2"/><text x="158" y="246" fill="#243943" font-size="18" text-anchor="start">B</text><path d="M290,205 L160,205" fill="none" stroke="#b74444" stroke-width="3"/><path d="M160,205 L172.0,210.0 L172.0,200.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="165" y="230" fill="#b74444" font-size="16" text-anchor="start">force on +q</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Bar is 4 mm above wire.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">v upward; B into page.</text><text x="440" y="182" fill="#243943" font-size="18" text-anchor="start">Positive charge moves</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">left.</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">V_A − V_B = +15 mV</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 7</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>