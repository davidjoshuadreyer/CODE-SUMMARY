<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 9: Ampèrian integral inside a hollow conductor</title><desc id="desc">The dashed Amperian circle encloses only part of the conducting annulus; the central hole is empty. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="215" cy="200" r="110" fill="#dcefed" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="200" r="55.0" fill="#fcfbf7" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="200" r="91.66666666666667" fill="none" stroke="#b74444" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M215,200 L325,200" fill="none" stroke="#71828a" stroke-width="2"/><text x="277" y="223" fill="#243943" font-size="16" text-anchor="start">b = 6 mm</text><path d="M215,200 L215,145.0" fill="none" stroke="#71828a" stroke-width="2"/><text x="230" y="177" fill="#243943" font-size="16" text-anchor="start">a = 3 mm</text><text x="110" y="335" fill="#b74444" font-size="17" text-anchor="start">Dashed circle: r = 5 mm</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Cross-section of</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">conductor.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Enclosed current = 23.70</text><text x="440" y="191" fill="#243943" font-size="18" text-anchor="start">A.</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="star