<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 6: Steady motional induction and power</title><desc id="desc">Applied force balances magnetic drag on the moving rod. Mechanical power becomes resistor heating; field polarity is unspecified. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M110 130 L350 130 M110 290 L350 290 M110 130 L110 290" stroke="#243943" stroke-width="3" fill="none"/><rect x="96" y="180" width="28" height="60" fill="#fcfbf7" stroke="#b74444" stroke-width="2.5"/><path d="M280,120 L280,300" fill="none" stroke="#087f8c" stroke-width="7"/><path d="M285,205 L385,205" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M385,205 L373.0,200.0 L373.0,210.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M275,245 L190,245" fill="none" stroke="#b74444" stroke-width="3"/><path d="M190,245 L202.0,250.0 L202.0,240.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><text x="290" y="180" fill="#243943" font-size="16" text-anchor="start">v, F applied</text><text x="175" y="278" fill="#b74444" font-size="16" text-anchor="start">F magnetic</text><text x="35" y="215" fill="#243943" font-size="17" text-anchor="start">12 Ω</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Rod length: 10 cm.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Steady speed: 2.0 m/s.</text><text x="440" y="182" fill="#243943" font-size="18" text-anchor="start">Mechanical power: Fv =</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">1.2 W.</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">I²R = Fv → I = 0.316 A</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 6</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>