<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 3: Field from concentric circular arcs</title><desc id="desc">Quarter-circle and three-quarter-circle arc contributions point into the page; radial connectors contribute zero at P. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M215 160 A45 45 0 0 1 260 205 L315 205 A100 100 0 1 1 215 105 L215 160" stroke="#087f8c" stroke-width="4" fill="none"/><path d="M247,173 L257,192" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M257,192 L255.83563391791844,179.0522491672531 L246.98645169409863,183.70971349557934 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M145,277 L123,248" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M123,248 L126.2691814219788,260.5822276576999 L134.23609413100277,254.5383628439576 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><circle cx="215" cy="205" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M210,200 L220,210" fill="none" stroke="#71828a" stroke-width="2"/><path d="M210,210 L220,200" fill="none" stroke="#71828a" stroke-width="2"/><text x="185" y="235" fill="#243943" font-size="18" text-anchor="start">P</text><text x="270" y="145" fill="#243943" font-size="16" text-anchor="start">a = 2 cm</text><text x="65" y="328" fill="#243943" font-size="16" text-anchor="start">b = 4 cm</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Inner arc: 90° clockwise.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Outer arc: 270°</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">clockwise.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Radial connectors: B = 0.</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">Both arcs add into page:</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">39.27 μT</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 3</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>