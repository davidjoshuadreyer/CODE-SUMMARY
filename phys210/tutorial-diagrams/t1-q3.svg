<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Displacement for half the acceleration</title><desc id="desc">Cart A (mass m) starts at rest with acceleration a and travels x in time t. Cart B (mass 4m) starts at rest with acceleration a/2. Find its distance in the same time.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T1-Q3  ·  Displacement for half the acceleration</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M120 150L410 150" fill="none" stroke="#137b80" stroke-width="4"/>
<polygon points="410,150 400.0,145.5 400.0,154.5" fill="#137b80"/>
<circle cx="120" cy="150" r="9" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="75" y="110" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">A: m, acceleration a</text>
<text x="265.0" y="180" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">x</text>
<path d="M120 270L265 270" fill="none" stroke="#137b80" stroke-width="4"/>
<polygon points="265,270 255.0,265.5 255.0,274.5" fill="#137b80"/>
<circle cx="120" cy="270" r="9" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="75" y="230" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">B: 4m, acceleration a/2</text>
<text x="192.5" y="300" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">x/2</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Both start at rest.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Compare the same time t.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Displacement = ½at²</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Half a → half the distance.</text>
</svg>