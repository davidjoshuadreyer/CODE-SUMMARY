<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 1: Acceleration of a negatively charged particle</title><desc id="desc">Velocity is along +x. The negative charge makes acceleration point +y and −z. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M90,215 L340,215" fill="none" stroke="#243943" stroke-width="3"/><path d="M340,215 L328.0,210.0 L328.0,220.0 Z" stroke="#243943" stroke-width="1" fill="#243943"/><text x="330" y="245" fill="#243943" font-size="18" text-anchor="start">+x</text><circle cx="150" cy="215" r="10" fill="#b74444" stroke="#b74444" stroke-width="2.5"/><text x="105" y="260" fill="#243943" font-size="18" text-anchor="start">q &lt; 0</text><text x="170" y="190" fill="#243943" font-size="17" text-anchor="start">v = 3.0 km/s</text><path d="M160,145 L160,80" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M160,80 L155.0,92.0 L165.0,92.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="175" y="100" fill="#243943" font-size="17" text-anchor="start">aᵧ = +36</text><circle cx="290" cy="110" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M285,105 L295,115" fill="none" stroke="#71828a" stroke-width="2"/><path d="M285,115 L295,105" fill="none" stroke="#71828a" stroke-width="2"/><text x="308" y="116" fill="#243943" font-size="18" text-anchor="start">a_z &lt; 0</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Bₓ is parallel to v: no</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">force.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">v × B = −12 j + 9 k</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Negative q reverses it:</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">a = 36 j − 27 k m/s²</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 1</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>