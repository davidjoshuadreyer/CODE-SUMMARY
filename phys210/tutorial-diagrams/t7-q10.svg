<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Resistance of a stretched wire</title><desc id="desc">Short thick wire stretched to four times length and one quarter area. Equal drawn rectangle areas emphasize conserved material volume.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Resistance of a stretched wire</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Stretching conserves volume; resistivity stays unchanged.</text><rect x="80" y="120" width="140" height="70" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="150" y="110" text-anchor="middle" font-size="18" fill="#243942">length ℓ, area A</text><text x="150" y="220" text-anchor="middle" font-size="18" fill="#243942">R = ρℓ/A</text><rect x="80" y="280" width="560" height="18" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="265" text-anchor="middle" font-size="18" fill="#243942">length 4ℓ, area A/4</text><line x1="320" y1="150" x2="500" y2="225" stroke="#176b72" stroke-width="3"/><polygon points="500,225 489.01675985487145,225.60698922102193 492.6972374511973,216.77384298984003" fill="#176b72"/><text x="410.0" y="165" text-anchor="middle" font-size="18" fill="#176b72">stretch</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Rfinal = ρ(4ℓ)/(A/4) = 16R</text></g></svg>