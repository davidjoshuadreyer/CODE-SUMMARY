<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 9 · Question 11: Field for a proton velocity selector</title><desc id="desc">Crossed fields balance electric and magnetic forces on the selected proton speed. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M60,100 L360,100" fill="none" stroke="#243943" stroke-width="4"/><path d="M60,310 L360,310" fill="none" stroke="#243943" stroke-width="4"/><text x="85" y="90" fill="#243943" font-size="18" text-anchor="start">−   −   −   −   −</text><text x="85" y="338" fill="#243943" font-size="18" text-anchor="start">+   +   +   +   +</text><circle cx="200" cy="205" r="8" fill="#b74444" stroke="#b74444" stroke-width="2.5"/><path d="M200,205 L330,205" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M330,205 L318.0,200.0 L318.0,210.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="305" y="190" fill="#243943" font-size="18" text-anchor="start">v</text><path d="M200,200 L200,125" fill="none" stroke="#b74444" stroke-width="3"/><path d="M200,125 L195.0,137.0 L205.0,137.0 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><path d="M200,210 L200,285" fill="none" stroke="#243943" stroke-width="3"/><path d="M200,285 L205.0,273.0 L195.0,273.0 Z" stroke="#243943" stroke-width="1" fill="#243943"/><text x="220" y="145" fill="#b74444" font-size="17" text-anchor="start">F_E</text><text x="220" y="280" fill="#243943" font-size="17" text-anchor="start">F_B</text><circle cx="90" cy="160" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="90" cy="160" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="108" y="166" fill="#243943" font-size="18" text-anchor="start">B</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">One possible orientation.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">E upward; B out of page.</text><text x="440" y="182" fill="#243943" font-size="18" text-anchor="start">For a proton: F_E = −F_B.</text><text x="440" y="223" fill="#243943" font-size="18" text-anchor="start">B = E/v = 0.129 T</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 9 · Question 11</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>