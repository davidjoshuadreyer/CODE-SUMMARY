<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Symmetric charges: zero field, nonzero potential</title><desc id="desc">Equal positive charges flank the origin at equal distances. Equal opposite field arrows cancel at the test charge.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Symmetric charges: zero field, nonzero potential</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Fields cancel as vectors; potentials add as scalars.</text><line x1="80" y1="205" x2="640" y2="205" stroke="#243942" stroke-width="2"/><circle cx="130" cy="205" r="19" fill="#176b72"/><text x="130" y="211" text-anchor="middle" font-size="23" fill="white">+</text><text x="130" y="249" text-anchor="middle" font-size="18" fill="#243942">+2.00 μC</text><circle cx="590" cy="205" r="19" fill="#176b72"/><text x="590" y="211" text-anchor="middle" font-size="23" fill="white">+</text><text x="590" y="249" text-anchor="middle" font-size="18" fill="#243942">+2.00 μC</text><circle cx="360" cy="205" r="6" fill="#176b72"/><text x="360" y="245" text-anchor="middle" font-size="18" fill="#243942">test charge at x = 0</text><line x1="360" y1="160" x2="470" y2="160" stroke="#176b72" stroke-width="3"/><polygon points="470,160 460.0950818741206,164.78462087522354 460.0950818741206,155.21537912477646" fill="#176b72"/><text x="415.0" y="135" text-anchor="middle" font-size="18" fill="#176b72">E from left</text><line x1="360" y1="290" x2="250" y2="290" stroke="#176b72" stroke-width="3"/><polygon points="250,290 259.9049181258794,285.21537912477646 259.9049181258794,294.78462087522354" fill="#176b72"/><text x="305.0" y="320" text-anchor="middle" font-size="18" fill="#176b72">E from right</text><text x="240" y="195" text-anchor="middle" font-size="16" fill="#243942">0.800 m</text><text x="480" y="195" text-anchor="middle" font-size="16" fill="#243942">0.800 m</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">E = 0 and F = 0, but V = 44.9 kV</text></g></svg>