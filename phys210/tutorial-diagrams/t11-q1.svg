<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 1: Field direction above two equal currents</title><desc id="desc">At P above the midpoint, the two field vectors have opposite vertical components and equal rightward components. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="100" cy="290" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M95,285 L105,295" fill="none" stroke="#71828a" stroke-width="2"/><path d="M95,295 L105,285" fill="none" stroke="#71828a" stroke-width="2"/><text x="118" y="296" fill="#243943" font-size="18" text-anchor="start">M</text><circle cx="330" cy="290" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><path d="M325,285 L335,295" fill="none" stroke="#71828a" stroke-width="2"/><path d="M325,295 L335,285" fill="none" stroke="#71828a" stroke-width="2"/><text x="348" y="296" fill="#243943" font-size="18" text-anchor="start">N</text><circle cx="215" cy="155" r="5" fill="#243943" stroke="#243943" stroke-width="2.5"/><text x="195" y="137" fill="#243943" font-size="18" text-anchor="start">P</text><path d="M100,290 L215,155" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><path d="M330,290 L215,155" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><path d="M215,155 L300,220" fill="none" stroke="#b74444" stroke-width="3"/><path d="M300,220 L293.5049565421276,208.73880954426446 L287.43045546641963,216.68238787403644 Z" stroke="#b74444" stroke-width="1" fill="#b74444"/><path d="M215,155 L300,90" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M300,90 L287.43045546641963,93.31761212596359 L293.5049565421276,101.26119045573554 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M215,155 L380,155" fill="none" stroke="#243943" stroke-width="3"/><path d="M380,155 L368.0,150.0 L368.0,160.0 Z" stroke="#243943" stroke-width="1" fill="#243943"/><text x="275" y="245" fill="#b74444" font-size="16" text-anchor="start">B from M</text><text x="280" y="75" fill="#087f8c" font-size="16" text-anchor="start">B from N</text><text x="300" y="183" fill="#243943" font-size="17" text-anchor="start">net →</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Both currents into page.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Clockwise field around</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">each wire.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Vertical parts cancel.</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">Horizontal parts add</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">rightward.</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 1</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>