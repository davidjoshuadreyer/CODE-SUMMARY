<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Brightness in a series-parallel bulb circuit</title><desc id="desc">Bulb A is in series with parallel bulbs B and C; A carries twice the current through either equal parallel branch.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Brightness in a series-parallel bulb circuit</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Equal-resistance model: A carries the sum of B and C currents.</text><line x1="120" y1="115" x2="330" y2="115" stroke="#243942" stroke-width="2"/><circle cx="360" cy="115" r="25" fill="#f5e8b0" stroke="#243942" stroke-width="2"/><text x="360" y="122" text-anchor="middle" font-size="20" fill="#243942">A</text><line x1="330" y1="115" x2="335" y2="115" stroke="#243942" stroke-width="2"/><line x1="385" y1="115" x2="550" y2="115" stroke="#243942" stroke-width="2"/><line x1="550" y1="115" x2="550" y2="195" stroke="#243942" stroke-width="2"/><line x1="120" y1="115" x2="120" y2="175" stroke="#243942" stroke-width="2"/><line x1="120" y1="175" x2="120" y2="204" stroke="#243942" stroke-width="2"/><line x1="100" y1="204" x2="140" y2="204" stroke="#243942" stroke-width="2"/><line x1="109" y1="216" x2="131" y2="216" stroke="#243942" stroke-width="2"/><line x1="120" y1="216" x2="120" y2="245" stroke="#243942" stroke-width="2"/><text x="90" y="202" text-anchor="middle" font-size="18" fill="#243942">+</text><text x="90" y="225" text-anchor="middle" font-size="18" fill="#243942">−</text><text x="80" y="258" text-anchor="middle" font-size="17" fill="#243942">110 V</text><line x1="120" y1="245" x2="120" y2="305" stroke="#243942" stroke-width="2"/><line x1="120" y1="305" x2="550" y2="305" stroke="#243942" stroke-width="2"/><line x1="550" y1="195" x2="400" y2="195" stroke="#243942" stroke-width="2"/><line x1="400" y1="195" x2="400" y2="220" stroke="#243942" stroke-width="2"/><circle cx="400" cy="245" r="25" fill="#f5e8b0" stroke="#243942" stroke-width="2"/><text x="400" y="252" text-anchor="middle" font-size="20" fill="#243942">B</text><line x1="400" y1="270" x2="400" y2="305" stroke="#243942" stroke-width="2"/><line x1="550" y1="195" x2="550" y2="220" stroke="#243942" stroke-width="2"/><circle cx="550" cy="245" r="25" fill="#f5e8b0" stroke="#243942" stroke-width="2"/><text x="550" y="252" text-anchor="middle" font-size="20" fill="#243942">C</text><line x1="550" y1="270" x2="550" y2="305" stroke="#243942" stroke-width="2"/><line x1="190" y1="155" x2="285" y2="155" stroke="#176b72" stroke-width="3"/><polygon points="285,155 275.0950818741206,159.78462087522354 275.0950818741206,150.21537912477646" fill="#176b72"/><text x="237.5" y="185" text-anchor="middle" font-size="18" fill="#176b72">2I</text><text x="400" y="185" text-anchor="middle" font-size="18" fill="#243942">I</text><text x="575" y="215" text-anchor="middle" font-size="18" fill="#243942">I</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">PA : PB : PC = 4 : 1 : 1 → A brightest</text></g></svg>