<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">A proton brought to rest by an electric field</title><desc id="desc">A proton initially moves along +x in E = −6.00×10⁵ i N/C and stops after 7.00 cm. Find (a) acceleration, (b) initial speed, and (c) stopping time.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q23-44  ·  A proton brought to rest by an electric field</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M420 110L90 110" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="90,110 100.0,114.5 100.0,105.5" fill="#137b80"/>
<text x="140" y="88" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E = −6.00 × 10⁵ i N/C</text>
<circle cx="130" cy="230" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="130" y="236" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="130" y="274" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">proton</text>
<path d="M155 230L230 230" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="230,230 220.0,225.5 220.0,234.5" fill="#be4949"/>
<text x="185" y="210" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">v₀</text>
<circle cx="410" cy="230" r="6" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="370" y="265" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">v = 0</text>
<path d="M130 300L410 300" fill="none" stroke="#253840" stroke-width="2"/>
<text x="240" y="330" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">7.00 cm</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Velocity starts along +x.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Acceleration is along −x.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">aₓ = −5.747 × 10¹³ m/s²</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">v₀² = −2aₓΔx</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">tstop = −v₀/aₓ</text>
</svg>