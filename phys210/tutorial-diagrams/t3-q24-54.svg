<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Flux of a nonuniform field through a rectangle</title><desc id="desc">E = ay i + bz j + cx k, with constant a,b,c. Find flux through the xy rectangle 0 ≤ x ≤ w and 0 ≤ y ≤ h.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T3-Q24-54  ·  Flux of a nonuniform field through a rectangle</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M90 300 L370 300 L425 210 L145 210 Z" fill="none" stroke="#137b80" stroke-width="2"/>
<path d="M135 270L135 245" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="135,245 130.5,255.0 139.5,255.0" fill="#be4949"/>
<path d="M225 270L225 200" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="225,200 220.5,210.0 229.5,210.0" fill="#be4949"/>
<path d="M320 270L320 150" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="320,150 315.5,160.0 324.5,160.0" fill="#be4949"/>
<text x="205" y="330" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">w along +x</text>
<text x="390" y="275" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">h</text>
<text x="100" y="180" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">+z normal ↑</text>
<text x="140" y="355" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E normal = cx grows with x</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Surface lies in the xy plane.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Only Eᶻ = cx contributes.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Average normal field = cw/2</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Area = wh</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Φ = ½chw²</text>
</svg>