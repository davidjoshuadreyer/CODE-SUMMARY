<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Field within a charged cylindrical annulus</title><desc id="desc">Uniform density +80 nC/m³ occupies a long cylindrical annulus between radii 1.0 mm and 3.0 mm. Find E at radius 2.0 mm.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T4-Q5  ·  Field within a charged cylindrical annulus</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<circle cx="230" cy="210" r="110" fill="#e9f2f1" stroke="#137b80" stroke-width="2"/>
<circle cx="230" cy="210" r="37" fill="#fffefa" stroke="#137b80" stroke-width="2"/>
<circle cx="230" cy="210" r="73" fill="none" stroke="#be4949" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="230" cy="210" r="3" fill="#253840" stroke="#253840" stroke-width="2"/>
<path d="M230 210L307.0 133.0" fill="none" stroke="#137b80" stroke-width="2"/>
<polygon points="307.0,133.0 296.74695167279503,136.88908729652601 303.110912703474,143.25304832720494" fill="#137b80"/>
<text x="279.5" y="150.5" font-family="Arial, sans-serif" font-size="18" fill="#137b80" text-anchor="start">R</text>
<path d="M230 210L303 210" fill="none" stroke="#be4949" stroke-width="2"/>
<polygon points="303,210 293.0,205.5 293.0,214.5" fill="#be4949"/>
<text x="266.5" y="235" font-family="Arial, sans-serif" font-size="18" fill="#be4949" text-anchor="start">r</text>
<text x="90" y="345" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Cross-section; length ℓ into page</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Charged annulus: ρ &gt; 0</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Inner radius = 1.0 mm</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Outer radius = 3.0 mm</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Dashed: r = 2.0 mm</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Qenc = ρπ(r² − ri²)ℓ</text>
</svg>