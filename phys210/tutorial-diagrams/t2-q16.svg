<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Electric field between thundercloud charge concentrations</title><desc id="desc">An aircraft is at height 2000 m; +40.0 C is at 3000 m and −40.0 C at 1000 m. Treat the concentrations as point charges and find E at the aircraft.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T2-Q16  ·  Electric field between thundercloud charge concentrations</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<circle cx="220" cy="90" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="220" y="96" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="220" y="134" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">+40.0 C</text>
<circle cx="220" cy="300" r="17" fill="#fffefa" stroke="#137b80" stroke-width="2"/>
<text x="220" y="306" font-family="Arial, sans-serif" font-size="22" fill="#137b80" text-anchor="middle">−</text>
<text x="220" y="344" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">−40.0 C</text>
<circle cx="220" cy="205" r="6" fill="#253840" stroke="#253840" stroke-width="2"/>
<text x="60" y="205" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">Aircraft</text>
<path d="M270 175L270 235" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="270,235 274.5,225.0 265.5,225.0" fill="#be4949"/>
<path d="M305 175L305 235" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="305,235 309.5,225.0 300.5,225.0" fill="#137b80"/>
<text x="260" y="265" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">E₊ + E₋</text>
<text x="330" y="95" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">3000 m</text>
<text x="330" y="210" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">2000 m</text>
<text x="330" y="310" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">1000 m</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Both fields point downward.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Each distance = 1000 m.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">E = 2k(40)/(1000)²</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">E = 7.190 × 10⁵ N/C ↓</text>
</svg>