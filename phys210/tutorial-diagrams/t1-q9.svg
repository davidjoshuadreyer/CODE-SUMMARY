<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Force from two charges in a right triangle</title><desc id="desc">Place Q₂ = +80 nC at (0,0), Q₁ = +60 nC at (0,3.0 mm), and q = +24 nC at (4.0 mm,0). Find the net force magnitude on q.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T1-Q9  ·  Force from two charges in a right triangle</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<circle cx="100" cy="105" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="100" y="111" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="100" y="149" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">Q₁ = +60 nC</text>
<circle cx="100" cy="270" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="100" y="276" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="100" y="314" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">Q₂ = +80 nC</text>
<circle cx="340" cy="270" r="17" fill="#fffefa" stroke="#be4949" stroke-width="2"/>
<text x="340" y="276" font-family="Arial, sans-serif" font-size="22" fill="#be4949" text-anchor="middle">+</text>
<text x="340" y="314" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="middle">q = +24 nC</text>
<path d="M100 105L340 270" fill="none" stroke="#69777d" stroke-width="1" stroke-dasharray="6 5"/>
<text x="40" y="195" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">3 mm</text>
<text x="195" y="300" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">4 mm</text>
<text x="225" y="160" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">5 mm</text>
<path d="M360 270L445 270" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="445,270 435.0,265.5 435.0,274.5" fill="#137b80"/>
<path d="M350 283L420 331" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="420,331 414.2975890815221,321.63343661117784 409.2078338815584,329.0559962777916" fill="#be4949"/>
<text x="405" y="248" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">F₂</text>
<text x="430" y="333" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">F₁</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">At q: both forces repel.</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">F₁ is rightward and downward.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">F₂ is rightward.</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">F = (1.4927i − 0.3106j) N</text>
</svg>