<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Magnetic acceleration of an electron</title><desc id="desc">Projection onto yz plane shows perpendicular magnetic field with positive y and z components; electron acceleration has positive y and negative z components. Velocity points out of plane.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Magnetic acceleration of an electron</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">View the y–z plane; velocity is along +x, out of this plane.</text><line x1="200" y1="235" x2="200" y2="95" stroke="#176b72" stroke-width="3"/><polygon points="200,95 204.78462087522354,104.90491812587945 195.21537912477646,104.90491812587945" fill="#176b72"/><text x="170" y="95" text-anchor="middle" font-size="18" fill="#176b72">+z</text><line x1="200" y1="235" x2="570" y2="235" stroke="#176b72" stroke-width="3"/><polygon points="570,235 560.0950818741205,239.78462087522354 560.0950818741205,230.21537912477646" fill="#176b72"/><text x="600" y="240" text-anchor="middle" font-size="18" fill="#176b72">+y</text><line x1="200" y1="235" x2="290" y2="115" stroke="#176b72" stroke-width="3"/><polygon points="290,115 287.88474582465113,125.79470702583768 280.2293524242935,120.05316197556944" fill="#176b72"/><text x="310" y="150" text-anchor="middle" font-size="18" fill="#176b72">B⊥</text><line x1="200" y1="235" x2="320" y2="325" stroke="#ad433d" stroke-width="3"/><polygon points="320,325 309.2052929741623,322.88474582465113 314.9468380244306,315.2293524242935" fill="#ad433d"/><text x="430" y="310" text-anchor="middle" font-size="18" fill="#ad433d">electron a</text><circle cx="200" cy="235" r="11" fill="#176b72"/><circle cx="200" cy="235" r="4" fill="white"/><text x="110" y="278" text-anchor="middle" font-size="16" fill="#243942">v: out of plane</text><text x="510" y="105" text-anchor="middle" font-size="18" fill="#243942">Bᵧ = 1.5 T</text><text x="510" y="137" text-anchor="middle" font-size="18" fill="#243942">Bz = 2.0 T</text><text x="510" y="170" text-anchor="middle" font-size="16" fill="#243942">Bₓ = 3.0 T: no force</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">|B⊥| = 2.5 T  •  |a| = 2.64 × 10¹⁸ m/s²</text></g></svg>