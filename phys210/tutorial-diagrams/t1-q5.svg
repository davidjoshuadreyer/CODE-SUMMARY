<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Vector needed for a vertical resultant</title><desc id="desc">B + C points along +y and has magnitude |C|, where C = 3i + 4j. Find |B|.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T1-Q5  ·  Vector needed for a vertical resultant</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<path d="M120 310L420 310" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="420,310 410.0,305.5 410.0,314.5" fill="#69777d"/>
<path d="M120 310L120 75" fill="none" stroke="#69777d" stroke-width="1.5"/>
<polygon points="120,75 115.5,85.0 124.5,85.0" fill="#69777d"/>
<path d="M120 310L300 150" fill="none" stroke="#137b80" stroke-width="3"/>
<polygon points="300,150 289.53626953842877,153.28029645422274 295.5155440878981,160.00698032237565" fill="#137b80"/>
<path d="M300 150L120 110" fill="none" stroke="#be4949" stroke-width="3"/>
<polygon points="120,110 128.78568354165557,116.56214634901436 130.73805766202346,107.77646280735878" fill="#be4949"/>
<path d="M120 310L120 110" fill="none" stroke="#253840" stroke-width="3"/>
<polygon points="120,110 115.5,120.0 124.5,120.0" fill="#253840"/>
<text x="245" y="250" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">C = (3, 4)</text>
<text x="230" y="105" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">B = (−3, 1)</text>
<text x="135" y="200" font-family="Arial, sans-serif" font-size="18" fill="#253840" text-anchor="start">R = (0, 5)</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">B + C = R</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Horizontal components cancel.</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Resultant magnitude = |C| = 5</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">|B| = √10</text>
</svg>