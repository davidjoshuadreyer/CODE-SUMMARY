<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 8: Magnetic flux through an internal disk</title><desc id="desc">The shaded inner area is the surface used for flux, not the full solenoid cross-section. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><circle cx="215" cy="205" r="110" fill="#eef2f1" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="205" r="60" fill="#d8ece8" stroke="#087f8c" stroke-width="2.5"/><circle cx="215" cy="205" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="215" cy="205" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="80" y="340" fill="#243943" font-size="17" text-anchor="start">Cross-section normal to axis</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Outer solenoid radius: 4</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">cm.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">Shaded disk radius: 2 cm.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Use disk area, π(0.02)².</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">Φ = BA = 15.79 μWb</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 10 · Question 8</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-widt