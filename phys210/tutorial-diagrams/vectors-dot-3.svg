.2,145.8 232.0,145.6 230.9,145.4 229.7,145.2 228.5,145.1 227.4,145.1 226.2,145.0 225.0,145.0 223.8,145.0 222.6,145.1 221.5,145.1 220.3,145.2 219.1,145.4 218.0,145.6 216.8,145.8 215.6,146.0 214.5,146.2 213.4,146.5 212.2,146.9 211.1,147.2 210.0,147.6 208.9,148.0 207.8,148.4 206.7,148.9 205.6,149.4 204.6,149.9 203.5,150.5 202.5,151.0"/><text x="225.0" y="119.0" fill="#625d51" font-size="17" text-anchor="middle">60°</text><text x="455.0" y="115.0" fill="#242420" font-size="17" text-anchor="start">DOT PRODUCT</text><text x="455.0" y="155.0" fill="#242420" font-size="25" text-anchor="start">W = F · d</text><text x="455.0" y="201.0" fill="#242420" font-size="18" text-anchor="start">F: 30° east of north</text><text x="455.0" y="229.0" fill="#242420" font-size="18" text-anchor="start">d: 60° north of west</text><text x="455.0" y="257.0" fill="#242420" font-size="18" text-anchor="start">Relative angle: 60°</text><text x="28.0" y="356.0" fill="#242420" font-size="16" text-anchor="start">Directions follow the stated coordinate system; arrow lengths are schematic.</text></g></svg>