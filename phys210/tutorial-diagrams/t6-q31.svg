<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Stored energy at two battery voltages</title><desc id="desc">Same three microfarad capacitor at twelve and six volts, with energy bars in four-to-one ratio.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Stored energy at two battery voltages</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Stored energy scales with voltage squared at fixed capacitance.</text><line x1="172" y1="125" x2="203" y2="125" stroke="#243942" stroke-width="2"/><line x1="203" y1="103" x2="203" y2="147" stroke="#243942" stroke-width="2"/><line x1="217" y1="103" x2="217" y2="147" stroke="#243942" stroke-width="2"/><line x1="217" y1="125" x2="248" y2="125" stroke="#243942" stroke-width="2"/><text x="210" y="93" text-anchor="middle" font-size="17" fill="#243942">3.00 μF</text><text x="210" y="175" text-anchor="middle" font-size="18" fill="#243942">12.0 V</text><rect x="155" y="225" width="110" height="100" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="210" y="215" text-anchor="middle" font-size="18" fill="#243942">216 μJ</text><line x1="472" y1="125" x2="503" y2="125" stroke="#243942" stroke-width="2"/><line x1="503" y1="103" x2="503" y2="147" stroke="#243942" stroke-width="2"/><line x1="517" y1="103" x2="517" y2="147" stroke="#243942" stroke-width="2"/><line x1="517" y1="125" x2="548" y2="125" stroke="#243942" stroke-width="2"/><text x="510" y="93" text-anchor="middle" font-size="17" fill="#243942">3.00 μF</text><text x="510" y="175" text-anchor="middle" font-size="18" fill="#243942">6.00 V</text><rect x="455" y="300" width="110" height="25" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="510" y="290" text-anchor="middle" font-size="18" fill="#243942">54.0 μJ</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Halving voltage gives one quarter of the stored energy.</text></g></svg>