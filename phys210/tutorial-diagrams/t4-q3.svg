<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Field outside a uniformly charged cylinder</title><desc id="desc">Each 2.0 m length of a long cylinder of radius 4.0 mm contains +4.0 nC uniformly. Find E at radius 5.0 mm.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="400" fill="#fffefa"/>
<text x="25" y="30" font-family="Arial, sans-serif" font-size="20" fill="#253840" text-anchor="start">T4-Q3  ·  Field outside a uniformly charged cylinder</text>
<path d="M25 45L775 45" fill="none" stroke="#d6dedd" stroke-width="1"/>
<text x="25" y="383" font-family="Arial, sans-serif" font-size="14" fill="#69777d" text-anchor="start">SCHEMATIC · not to scale unless axes are numbered</text>
<circle cx="230" cy="210" r="85" fill="#e9f2f1" stroke="#137b80" stroke-width="2"/>
<circle cx="230" cy="210" r="110" fill="none" stroke="#be4949" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="230" cy="210" r="3" fill="#253840" stroke="#253840" stroke-width="2"/>
<path d="M230 210L289.5 150.5" fill="none" stroke="#137b80" stroke-width="2"/>
<polygon points="289.5,150.5 279.24695167279503,154.38908729652601 285.610912703474,160.75304832720494" fill="#137b80"/>
<text x="268.25" y="161.75" font-family="Arial, sans-serif" font-size="18" fill="#137b80" text-anchor="start">R</text>
<path d="M230 210L340 210" fill="none" stroke="#be4949" stroke-width="2"/>
<polygon points="340,210 330.0,205.5 330.0,214.5" fill="#be4949"/>
<text x="285.0" y="235" font-family="Arial, sans-serif" font-size="18" fill="#be4949" text-anchor="start">r</text>
<text x="90" y="345" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Cross-section; length ℓ into page</text>
<text x="480" y="100" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">λ = 4.0 nC / 2.0 m</text>
<text x="480" y="130" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">R = 4.0 mm; r = 5.0 mm</text>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">Dashed: Gaussian surface</text>
<text x="480" y="190" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">All cylinder charge is enclosed.</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="17" fill="#253840" text-anchor="start">E = λ / (2πε₀r), outward</text>
</svg>