<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Pulling plates apart while connected to a battery</title><desc id="desc">At fixed battery voltage, doubling plate spacing halves both capacitance and charge.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Pulling plates apart while connected to a battery</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Plate spacing doubles with battery connected.</text><text x="190" y="112" text-anchor="middle" font-size="18" fill="#607278">BEFORE</text><text x="530" y="112" text-anchor="middle" font-size="18" fill="#607278">AFTER</text><line x1="160.0" y1="135" x2="160.0" y2="245" stroke="#176b72" stroke-width="4"/><line x1="220.0" y1="135" x2="220.0" y2="245" stroke="#ad433d" stroke-width="4"/><text x="142.0" y="190" text-anchor="middle" font-size="22" fill="#176b72">+</text><text x="238.0" y="190" text-anchor="middle" font-size="22" fill="#ad433d">−</text><text x="190" y="275" text-anchor="middle" font-size="18" fill="#243942">d, C₀, Q₀</text><line x1="470.0" y1="135" x2="470.0" y2="245" stroke="#176b72" stroke-width="4"/><line x1="590.0" y1="135" x2="590.0" y2="245" stroke="#ad433d" stroke-width="4"/><text x="452.0" y="190" text-anchor="middle" font-size="22" fill="#176b72">+</text><text x="608.0" y="190" text-anchor="middle" font-size="22" fill="#ad433d">−</text><text x="530" y="275" text-anchor="middle" font-size="18" fill="#243942">2d, C₀/2, Q₀/2</text><line x1="310" y1="190" x2="405" y2="190" stroke="#176b72" stroke-width="3"/><polygon points="405,190 395.0950818741206,194.78462087522354 395.0950818741206,185.21537912477646" fill="#176b72"/><text x="190" y="310" text-anchor="middle" font-size="17" fill="#243942">Battery keeps V fixed</text><text x="530" y="310" text-anchor="middle" font-size="17" fill="#243942">Battery keeps V fixed</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">V = V₀ fixed  •  Q = CV  •  charge returns to the battery</text></g></svg>