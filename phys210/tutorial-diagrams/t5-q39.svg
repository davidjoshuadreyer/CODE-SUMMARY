<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Electric field from a three-dimensional potential</title><desc id="desc">Local component triangle at P: electric field points toward negative x and negative y with equal components, and zero z component.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Electric field from a three-dimensional potential</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Field components at P = (1, 0, −2) m; local x–y plane.</text><line x1="370" y1="180" x2="620" y2="180" stroke="#176b72" stroke-width="3"/><polygon points="620,180 610.0950818741205,184.78462087522354 610.0950818741205,175.21537912477646" fill="#176b72"/><text x="640" y="185" text-anchor="middle" font-size="18" fill="#176b72">+x</text><line x1="370" y1="180" x2="370" y2="90" stroke="#176b72" stroke-width="3"/><polygon points="370,90 374.78462087522354,99.90491812587945 365.21537912477646,99.90491812587945" fill="#176b72"/><text x="400" y="95" text-anchor="middle" font-size="18" fill="#176b72">+y</text><line x1="370" y1="180" x2="250" y2="180" stroke="#176b72" stroke-width="3"/><polygon points="250,180 259.9049181258794,175.21537912477646 259.9049181258794,184.78462087522354" fill="#176b72"/><text x="310.0" y="155" text-anchor="middle" font-size="18" fill="#176b72">Eₓ = −5 V/m</text><line x1="370" y1="180" x2="370" y2="300" stroke="#176b72" stroke-width="3"/><polygon points="370,300 365.21537912477646,290.0950818741206 374.78462087522354,290.0950818741206" fill="#176b72"/><text x="490" y="275" text-anchor="middle" font-size="18" fill="#176b72">Eᵧ = −5 V/m</text><line x1="370" y1="180" x2="250" y2="300" stroke="#ad433d" stroke-width="3"/><polygon points="250,300 253.62059690762962,289.61292735981584 260.38707264018416,296.37940309237035" fill="#ad433d"/><text x="245" y="260" text-anchor="middle" font-size="18" fill="#ad433d">E</text><line x1="250" y1="180" x2="250" y2="300" stroke="#607278" stroke-width="2" stroke-dasharray="6 5"/><line x1="250" y1="300" x2="370" y2="300" stroke="#607278" stroke-width="2" stroke-dasharray="6 5"/><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">E = −∇V  •  Ez = 0  •  |E| = √50 = 7.07 V/m</text></g></svg>