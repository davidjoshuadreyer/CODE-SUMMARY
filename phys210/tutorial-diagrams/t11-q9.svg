<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 9: Ways to induce a coil current</title><desc id="desc">Moving a magnet, moving a coil, or changing a nearby current can each change magnetic flux linkage. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><rect x="65" y="95" width="70" height="40" fill="none" stroke="#b74444" stroke-width="2.5"/><text x="72" y="122" fill="#243943" font-size="17" text-anchor="start">S   N</text><ellipse cx="290" cy="115" rx="13" ry="27" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M150,115 L230,115" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M230,115 L218.0,110.0 L218.0,120.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="70" y="73" fill="#243943" font-size="17" text-anchor="start">(a) Magnet moves</text><rect x="65" y="195" width="70" height="40" fill="none" stroke="#b74444" stroke-width="2.5"/><text x="72" y="222" fill="#243943" font-size="17" text-anchor="start">S   N</text><ellipse cx="290" cy="215" rx="13" ry="27" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M255,215 L175,215" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M175,215 L187.0,220.0 L187.0,210.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><text x="70" y="173" fill="#243943" font-size="17" text-anchor="start">(b) Coil moves</text><ellipse cx="100" cy="315" rx="13" ry="27" fill="none" stroke="#b74444" stroke-width="2.5"/><ellipse cx="290" cy="315" rx="13" ry="27" fill="none" stroke="#087f8c" stroke-width="2.5"/><text x="150" y="322" fill="#b74444" font-size="18" text-anchor="start">I(t) ↑</text><text x="70" y="273" fill="#243943" font-size="17" text-anchor="start">(c) Source current grows</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">All three can change flux</text><text x="440" y="125" fill="#243943" font-size="18" text-anchor="start">through a closed coil.</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">emf = −d(NΦ)/dt</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">A changing field can</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">induce current without</text><text x="440" y="257" fill="#243943" font-size="18" text-anchor="start">motion.</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 9</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>