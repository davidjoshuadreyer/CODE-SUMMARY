<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Solve a magnetic cross product for By</title><desc id="desc">Three-row component dependency diagram isolates By from z force, Bz from y force, then checks x force with both values.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Solve a magnetic cross product for By</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Component map for B = (0, Bᵧ, Bz); charge q = +2 C.</text><rect x="50" y="97" width="175" height="48" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="138" y="128" text-anchor="middle" font-size="19" fill="#243942">Fz = 12 N</text><line x1="245" y1="120" x2="330" y2="120" stroke="#176b72" stroke-width="3"/><polygon points="330,120 320.0950818741206,124.78462087522354 320.0950818741206,115.21537912477646" fill="#176b72"/><text x="510" y="128" text-anchor="middle" font-size="19" fill="#243942">4Bᵧ = 12 → Bᵧ = 3 T</text><rect x="50" y="177" width="175" height="48" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="138" y="208" text-anchor="middle" font-size="19" fill="#243942">Fᵧ = −20 N</text><line x1="245" y1="200" x2="330" y2="200" stroke="#176b72" stroke-width="3"/><polygon points="330,200 320.0950818741206,204.78462087522354 320.0950818741206,195.21537912477646" fill="#176b72"/><text x="510" y="208" text-anchor="middle" font-size="19" fill="#243942">−4Bz = −20 → Bz = 5 T</text><rect x="50" y="257" width="175" height="48" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="138" y="288" text-anchor="middle" font-size="19" fill="#243942">Fₓ = 4 N</text><line x1="245" y1="280" x2="330" y2="280" stroke="#176b72" stroke-width="3"/><polygon points="330,280 320.0950818741206,284.78462087522354 320.0950818741206,275.21537912477646" fill="#176b72"/><text x="510" y="288" text-anchor="middle" font-size="19" fill="#243942">2(4 × 5 − 6 × 3) = 4 N</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">Consistency check: F · v = 4(2) − 20(4) + 12(6) = 0</text></g></svg>