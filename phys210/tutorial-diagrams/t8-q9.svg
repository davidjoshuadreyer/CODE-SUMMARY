<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Infer field direction from an electron force</title><desc id="desc">Velocity points right along positive x and magnetic field down along negative y. Dot symbol indicates electron force out of page along positive z.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Infer field direction from an electron force</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Right-hand rule gives v × B; negative charge reverses it.</text><line x1="190" y1="190" x2="520" y2="190" stroke="#176b72" stroke-width="3"/><polygon points="520,190 510.0950818741206,194.78462087522354 510.0950818741206,185.21537912477646" fill="#176b72"/><text x="355.0" y="165" text-anchor="middle" font-size="18" fill="#176b72">v in +x</text><line x1="190" y1="190" x2="190" y2="305" stroke="#176b72" stroke-width="3"/><polygon points="190,305 185.21537912477646,295.0950818741206 194.78462087522354,295.0950818741206" fill="#176b72"/><text x="280" y="285" text-anchor="middle" font-size="18" fill="#176b72">B in −y</text><circle cx="190" cy="190" r="22" fill="#fffefa" stroke="#ad433d" stroke-width="2"/><circle cx="190" cy="190" r="6" fill="#ad433d"/><text x="410" y="115" text-anchor="middle" font-size="20" fill="#ad433d">F in +z: out of page</text><text x="440" y="265" text-anchor="middle" font-size="18" fill="#243942">v × B is into page (−z)</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">For an electron: F = −e(v × B), so B points −y.</text></g></svg>