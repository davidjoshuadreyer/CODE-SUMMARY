<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 10 · Question 4: Infer currents from the force between wires</title><desc id="desc">Two parallel wires are separated by 6 mm. Magnitudes determine the larger current without selecting attraction or repulsion. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M130,95 L130,300" fill="none" stroke="#087f8c" stroke-width="5"/><path d="M300,95 L300,300" fill="none" stroke="#087f8c" stroke-width="5"/><text x="80" y="80" fill="#243943" font-size="17" text-anchor="start">i = 0.20 A</text><text x="255" y="80" fill="#243943" font-size="17" text-anchor="start">2i = 0.40 A</text><path d="M130,325 L300,325" fill="none" stroke="#71828a" stroke-width="2"/><text x="168" y="350" fill="#243943" font-size="17" text-anchor="start">6.0 mm</text><text x="175" y="190" fill="#243943" font-size="17" text-anchor="start">L = 3 m</text><text x="155" y="235" fill="#243943" font-size="17" text-anchor="start">|F| = 8 μN</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">Force magnitude only.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Current directions are</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">unspecified.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">|F| = μ₀ I₁I₂ L / (2πd)</text><text x="440" y="248" fill="#243943" font-size="18" text-anchor="start">Greater 