<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Tutorial 11 · Question 3: Induction in a loop near a long wire</title><desc id="desc">The loop below an increasing rightward current induces counterclockwise current to oppose the growing into-page flux. Schematic; not to scale.</desc><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#243943"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#087f8c"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b74444"/></marker></defs><rect width="760" height="400" fill="#fcfbf7"/><g font-family="Arial, sans-serif"><path d="M60,90 L380,90" fill="none" stroke="#243943" stroke-width="3"/><path d="M380,90 L368.0,85.0 L368.0,95.0 Z" stroke="#243943" stroke-width="1" fill="#243943"/><text x="100" y="76" fill="#243943" font-size="17" text-anchor="start">I increasing →</text><rect x="100" y="160" width="240" height="140" fill="none" stroke="#087f8c" stroke-width="2.5"/><path d="M300,160 L180,160" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M180,160 L192.0,165.0 L192.0,155.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><path d="M100,200 L100,270" fill="none" stroke="#087f8c" stroke-width="3"/><path d="M100,270 L105.0,258.0 L95.0,258.0 Z" stroke="#087f8c" stroke-width="1" fill="#087f8c"/><circle cx="220" cy="225" r="11" fill="none" stroke="#71828a" stroke-width="2.5"/><circle cx="220" cy="225" r="2.5" fill="#71828a" stroke="#71828a" stroke-width="2.5"/><text x="238" y="231" fill="#243943" font-size="18" text-anchor="start">B induced</text><path d="M65,95 L65,160" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><text x="25" y="140" fill="#243943" font-size="17" text-anchor="start">d</text><path d="M380,95 L380,300" fill="none" stroke="#71828a" stroke-width="2" stroke-dasharray="6 5"/><text x="387" y="220" fill="#243943" font-size="17" text-anchor="start">D</text><text x="150" y="330" fill="#243943" font-size="17" text-anchor="start">L = 1.5 m</text><text x="440" y="100" fill="#243943" font-size="18" text-anchor="start">d = 1 cm; D = 6 cm.</text><text x="440" y="141" fill="#243943" font-size="18" text-anchor="start">Source flux into page</text><text x="440" y="166" fill="#243943" font-size="18" text-anchor="start">increases.</text><text x="440" y="207" fill="#243943" font-size="18" text-anchor="start">Induced field out of</text><text x="440" y="232" fill="#243943" font-size="18" text-anchor="start">page.</text><text x="440" y="273" fill="#243943" font-size="18" text-anchor="start">Current: 27 mA</text><text x="440" y="298" fill="#243943" font-size="18" text-anchor="start">counterclockwise.</text><text x="24" y="34" fill="#243943" font-size="20" text-anchor="start">Tutorial 11 · Question 3</text><path d="M24,49 L736,49" fill="none" stroke="#c7d0d1" stroke-width="1"/><path d="M414,72 L414,340" fill="none" stroke="#d6dddd" stroke-width="1"/><text x="24" y="378" fill="#71828a" font-size="14" text-anchor="start">SCHEMATIC · NOT TO SCALE</text></g></svg>