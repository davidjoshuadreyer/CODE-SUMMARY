<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Potential difference near an infinite line charge</title><desc id="desc">Line charge viewed end-on with radial observation points r1 and r2. Outward field along integration path gives decreasing potential.</desc><rect width="720" height="400" fill="#fffefa"/><g font-family="Arial, sans-serif"><text x="30" y="34" text-anchor="start" font-size="22" fill="#243942">Potential difference near an infinite line charge</text><text x="30" y="61" text-anchor="start" font-size="16" fill="#607278">Cross-section of an infinite line charge; shown for λ &gt; 0.</text><circle cx="145" cy="205" r="13" fill="#176b72"/><text x="145" y="246" text-anchor="middle" font-size="18" fill="#243942">line charge λ</text><line x1="165" y1="205" x2="630" y2="205" stroke="#176b72" stroke-width="3"/><polygon points="630,205 620.0950818741205,209.78462087522354 620.0950818741205,200.21537912477646" fill="#176b72"/><text x="397.5" y="130" text-anchor="middle" font-size="18" fill="#176b72">radially outward E</text><circle cx="330" cy="205" r="6" fill="#176b72"/><text x="330" y="242" text-anchor="middle" font-size="18" fill="#243942">r₁</text><line x1="145" y1="285" x2="330" y2="285" stroke="#607278" stroke-width="2"/><text x="237.5" y="278" text-anchor="middle" font-size="16" fill="#243942">r₁</text><circle cx="555" cy="205" r="6" fill="#176b72"/><text x="555" y="242" text-anchor="middle" font-size="18" fill="#243942">r₂</text><line x1="145" y1="315" x2="555" y2="315" stroke="#607278" stroke-width="2"/><text x="350.0" y="308" text-anchor="middle" font-size="16" fill="#243942">r₂</text><rect x="30" y="344" width="660" height="40" rx="4" fill="#edf5f3" stroke="#176b72" stroke-width="1.5"/><text x="360" y="370" text-anchor="middle" font-size="18" fill="#243942">V(r₂) − V(r₁) = −[λ/(2πε₀)] ln(r₂/r₁)</text></g></svg>