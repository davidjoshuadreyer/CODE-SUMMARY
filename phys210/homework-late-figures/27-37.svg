<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 275" role="img"><title>Free-body diagram of the bar at lift-off</title><style>text{font:16px Cambria,Georgia,serif;fill:#263b42;stroke:none}.label{font-size:14px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#285663"/></marker></defs><g fill="none" stroke="#285663" stroke-width="2"><circle cx="180" cy="125" r="5" fill="#285663"/><path d="M180 125L180 35" marker-end="url(#arrow)"/><text x="200" y="45">F_B = ILB</text><path d="M180 125L180 215" marker-end="url(#arrow)"/><text x="200" y="210">mg</text><text x="320" y="90">At lift-off: N = 0</text><text x="320" y="125">Before lift-off: N + F_B = mg</text><text x="320" y="160">After lift-off: F_B − mg = ma</text></g></svg>