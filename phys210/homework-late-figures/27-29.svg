<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 275" role="img"><title>Electric and magnetic forces on the alpha particle</title><style>text{font:16px Cambria,Georgia,serif;fill:#263b42;stroke:none}.label{font-size:14px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#285663"/></marker></defs><g fill="none" stroke="#285663" stroke-width="2"><circle cx="210" cy="125" r="7"/><path d="M210 125L210 35" marker-end="url(#arrow)"/><text x="230" y="40">F_E = qE</text><path d="M210 125L210 215" marker-end="url(#arrow)"/><text x="230" y="215">F_B = qvB</text><path d="M230 125L360 125" marker-end="url(#arrow)"/><text x="365" y="130">v</text><text x="410" y="85">B out of page ⊙</text><text x="410" y="120">Net force = 0</text></g></svg>