<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 275" role="img"><title>Free-body diagram for the right suspended wire</title><style>text{font:16px Cambria,Georgia,serif;fill:#263b42;stroke:none}.label{font-size:14px}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L7 3Z" fill="#285663"/></marker></defs><g fill="none" stroke="#285663" stroke-width="2"><circle cx="230" cy="130" r="7"/><path d="M230 130L193 30" marker-end="url(#arrow)"/><text x="175" y="30">T</text><path d="M230 130L230 220" marker-end="url(#arrow)"/><text x="245" y="218">mg</text><path d="M230 130L390 130" marker-end="url(#arrow)"/><text x="395" y="135">F_B</text><path d="M230 130V25" stroke-dasharray="4 4"/><text x="216" y="72">θ</text><text x="420" y="65">T cos θ = mg</text><text x="420" y="95">T sin θ = F_B</text><text x="50" y="245" class="label">Angle exaggerated. The opposite wire has the mirrored force diagram.</text></g></svg>