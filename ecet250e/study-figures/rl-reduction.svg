<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690"><rect width="800" height="690" fill="#fffefb"/><style>text{font-family:Georgia,serif;fill:#242420;font-size:18px}.wire{stroke:#315860;stroke-width:2.3;fill:none;stroke-linejoin:round}.small{font-size:15px}.head{font-size:20px;font-weight:bold}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#315860"/></marker></defs><text x="28" y="32" class="head">1. Before opening · the inductor is a short circuit</text><path class="wire" d="M80 80L80 110"/><circle class="wire" cx="80" cy="135" r="25"/><path class="wire" d="M80 160L80 205"/><text x="71" y="130" class="">+</text><text x="74" y="153" class="">−</text><text x="16" y="184" class="">40 V</text><polyline class="wire" points="80.0,80.0 125.0,80.0 134.0,86.0 143.0,74.0 152.0,86.0 161.0,74.0 170.0,86.0 179.0,74.0 188.0,86.0 197.0,74.0 206.0,86.0 215.0,80.0 260.0,80.0"/><text x="158.0" y="64.0" class="">2 Ω</text><path class="wire" d="M260 80L325 80"/><polyline class="wire" points="325.0,80.0 375.0,80.0 385.0,86.0 395.0,74.0 405.0,86.0 415.0,74.0 425.0,86.0 435.0,74.0 445.0,86.0 455.0,74.0 465.0,86.0 475.0,80.0 525.0,80.0"/><text x="413.0" y="64.0" class="">4 Ω</text><polyline class="wire" points="325.0,80.0 325.0,111.2 319.0,117.5 331.0,123.8 319.0,130.0 331.0,136.2 319.0,142.5 331.0,148.8 319.0,155.0 331.0,161.2 319.0,167.5 325.0,173.8 325.0,205.0"/><text x="340.0" y="147.5" class="">12 Ω</text><polyline class="wire" points="525.0,80.0 525.0,111.2 519.0,117.5 531.0,123.8 519.0,130.0 531.0,136.2 519.0,142.5 531.0,148.8 519.0,155.0 531.0,161.2 519.0,167.5 525.0,173.8 525.0,205.0"/><text x="540.0" y="147.5" class="">16 Ω</text><path class="wire" d="M525 80L675 80"/><path class="wire" d="M675 80L675 205"/><path class="wire" d="M80 205L675 205"/><path class="wire" d="M705 110v45" marker-end="url(#arr)"/><text x="720" y="139" class="">6 A</text><text x="550" y="185" class="small">shorted</text><text x="100" y="238" class="small">12 Ω ∥ 4 Ω = 3 Ω;  source current = 40 / (2 + 3) = 8 A</text><text x="28" y="290" class="head">2. After opening · the source is disconnected</text><path class="wire" d="M180 330L300 330"/><polyline class="wire" points="300.0,330.0 300.0,361.2 294.0,367.5 306.0,373.8 294.0,380.0 306.0,386.2 294.0,392.5 306.0,398.8 294.0,405.0 306.0,411.2 294.0,417.5 300.0,423.8 300.0,455.0"/><text x="315.0" y="397.5" class="">12 Ω</text><polyline class="wire" points="300.0,330.0 352.5,330.0 363.0,336.0 373.5,324.0 384.0,336.0 394.5,324.0 405.0,336.0 415.5,324.0 426.0,336.0 436.5,324.0 447.0,336.0 457.5,330.0 510.0,330.0"/><text x="393.0" y="314.0" class="">4 Ω</text><polyline class="wire" points="510.0,330.0 510.0,361.2 504.0,367.5 516.0,373.8 504.0,380.0 516.0,386.2 504.0,392.5 516.0,398.8 504.0,405.0 516.0,411.2 504.0,417.5 510.0,423.8 510.0,455.0"/><text x="525.0" y="397.5" class="">16 Ω</text><path class="wire" d="M510 330L675 330"/><path class="wire" d="M675 330L675 355"/><path class="wire" d="M675 430L675 455"/><path class="wire" d="M675 355 c 25 0 25 18.75 0 18.75 c 25 0 25 18.75 0 18.75 c 25 0 25 18.75 0 18.75 c 25 0 25 18.75 0 18.75"/><text x="705" y="397.5" class="">2 H</text><path class="wire" d="M300 455L675 455"/><path class="wire" d="M752 360v45" marker-end="url(#arr)"/><text x="735" y="433" class="small">i(t)</text><text x="100" y="490" class="small">The inductor sees 16 Ω in parallel with the series path (4 Ω + 12 Ω).</text><text x="28" y="540" class="head">3. Equivalent natural-response circuit</text><path class="wire" d="M300 575L590 575"/><polyline class="wire" points="300.0,575.0 300.0,597.5 294.0,602.0 306.0,606.5 294.0,611.0 306.0,615.5 294.0,620.0 306.0,624.5 294.0,629.0 306.0,633.5 294.0,638.0 300.0,642.5 300.0,665.0"/><text x="315.0" y="625.0" class="">8 Ω</text><path class="wire" d="M590 575L590 600"/><path class="wire" d="M590 640L590 665"/><path class="wire" d="M590 600 c 25 0 25 10.0 0 10.0 c 25 0 25 10.0 0 10.0 c 25 0 25 10.0 0 10.0 c 25 0 25 10.0 0 10.0"/><text x="620" y="625.0" class="">2 H</text><path class="wire" d="M300 665L590 665"/><path class="wire" d="M670 592v45" marker-end="url(#arr)"/><text x="693" y="622" class="">i(t)</text><text x="50" y="605" class="small">τ = L / R</text><text x="50" y="630" class="small">= 2 / 8 = 0.25 s</text></svg>