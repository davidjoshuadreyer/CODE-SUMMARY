<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiple Choice Practice · ENGR 290</title>
<link rel="stylesheet" href="midterm-paper.css">
<script defer src="midterm-quiz-bank.js"></script>
<script defer src="midterm-paper.js"></script>
</head>
<body>
<main>
<nav aria-label="Course links"><a href="midterm.html">ENGR 290 study pack</a><a href="midterm/Noncalculator-Multiple-Choice.pdf">Printable PDF</a></nav>
<h1>ENGR 290 Multiple Choice Practice</h1>
<p class="subtitle">No calculator · Choose one answer per question</p>
<details class="settings"><summary>Practice options</summary>
<label>Topic <select id="topic"><option value="">All topics</option></select></label>
<label>Length <select id="length"><option value="60">Full set</option><option value="10">10 questions</option><option value="20">20 questions</option></select></label>
<button id="start">Start shuffled round</button>
</details>
<p id="score" role="status"></p>
<h2 id="range" tabindex="-1"></h2>
<div id="questions"></div>
<div class="controls"><button id="prev">Previous</button><span id="progress"></span><button id="next">Next</button><button id="mark">Mark test</button></div>
<div class="controls" id="review" hidden><button id="retry">Retry missed and revealed</button><button id="reset">New full test</button></div>
<noscript>Open the printable PDF above to practise without JavaScript.</noscript>
</main>
</body>
</html>
